<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Seyfa</title>

<link rel="icon" type="image/png" href="icon-192.png">

<style>
:root{
  --bg:#f2f2f7;--card:#fff;--sheet:#f2f2f7;--card-s:#fff;--text:#000;--text2:#3c3c43;--text3:#8e8e93;
  --sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.12);--bar:rgba(249,249,249,.82);
  --blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--purple:#af52de;--teal:#30b0c7;--pink:#ff2d55;
  --indigo:#5856d6;--yellow:#ffcc00;--brown:#a2845e;--mint:#00c7be;--cyan:#32ade6;--gray:#8e8e93;
  --blur:saturate(180%) blur(20px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#000;--card:#1c1c1e;--sheet:#1c1c1e;--card-s:#2c2c2e;--text:#fff;--text2:#ebebf5;--text3:#8e8e93;
  --sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.24);--bar:rgba(28,28,30,.82);
  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;--teal:#40c8e0;--pink:#ff375f;
  --indigo:#5e5ce6;--yellow:#ffd60a;--brown:#ac8e68;--mint:#63e6e2;--cyan:#64d2ff;--gray:#8e8e93;
}}
:root[data-theme=dark]{
  --bg:#000;--card:#1c1c1e;--sheet:#1c1c1e;--card-s:#2c2c2e;--text:#fff;--text2:#ebebf5;--text3:#8e8e93;
  --sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.24);--bar:rgba(28,28,30,.82);
  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;--teal:#40c8e0;--pink:#ff375f;
  --indigo:#5e5ce6;--yellow:#ffd60a;--brown:#ac8e68;--mint:#63e6e2;--cyan:#64d2ff;--gray:#8e8e93;
}
:root{color-scheme:light dark}:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit}
.nav{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);transition:background .2s,box-shadow .2s}
.nav.solid{background:var(--bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 .5px 0 var(--sep)}
.nav-in{max-width:760px;margin:0 auto;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;position:relative}
.nav .t{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;opacity:0;transition:opacity .2s;max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.solid .t{opacity:1}
.nbtn{border:0;background:none;color:var(--blue);padding:8px;border-radius:10px;display:flex;align-items:center;gap:4px;cursor:pointer;position:relative}
.nbtn svg{width:24px;height:24px}
.nbtn:active{opacity:.5}
.dot{position:absolute;right:5px;top:6px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg);background:var(--gray)}
.dot.ok{background:var(--green)}.dot.err{background:var(--red)}.dot.busy{background:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
main{max-width:760px;margin:0 auto;padding:0 16px}
h1.large{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.37px;margin:2px 0 14px}
.group-title{font-size:13px;text-transform:uppercase;color:var(--text3);margin:0 16px 6px;letter-spacing:-.08px;display:flex;justify-content:space-between;align-items:center}
.group-title .link{text-transform:none;font-size:15px;padding:0}
.group{background:var(--card);border-radius:12px;overflow:hidden;margin:0 0 22px}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative}
.row[hidden]{display:none!important}
.group>.row:not([hidden])~.row:not([hidden])::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.group>.row.ico:not([hidden])~.row.ico:not([hidden])::before{left:58px}
.row.swp{touch-action:pan-y;transition:transform .25s cubic-bezier(.2,.8,.2,1);background:var(--card);-webkit-user-select:none;user-select:none}
.row.swp.drag{transition:none}
.row.swp{-webkit-touch-callout:none}
.group-title.coll{cursor:pointer;-webkit-user-select:none;user-select:none}
.group-title .chev{transition:transform .2s;font-size:14px;color:var(--text3)}
.group-title.shut .chev{transform:rotate(-90deg)}
.group-title button.link{background:none;border:0;color:var(--blue);cursor:pointer;font:inherit;font-size:15px;text-transform:none}
.more{display:block;width:calc(100% - 32px);margin:0 16px 16px;border:0;border-radius:12px;background:var(--fill);color:var(--blue);padding:13px;font:inherit;font-size:16px;cursor:pointer}
.row.swp .sdel{position:absolute;left:100%;top:0;bottom:0;width:88px;border:0;background:var(--red);color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer;padding:0}
.row.tap{cursor:pointer}.row.tap:active{background:var(--fill)}
.row .grow{flex:1;min-width:0}
.row label{flex:0 0 auto;min-width:96px}
.row input,.row select{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--text);text-align:right;outline:none;padding:0;-webkit-appearance:none;appearance:none;text-align-last:right}
.row input::placeholder{color:var(--text3)}
.tgl{flex:none;appearance:none;-webkit-appearance:none;width:51px!important;height:31px!important;border-radius:16px;background:var(--fill);position:relative;cursor:pointer;transition:background .2s;border:0;outline:none}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.tgl:checked{background:var(--green)}.tgl:checked::after{transform:translateX(20px)}
.row input[type=checkbox]{flex:none;width:22px;height:22px;accent-color:var(--blue)}
.sub{font-size:13px;color:var(--text3)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{--c:var(--blue);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;background:var(--c);background:color-mix(in srgb,var(--c) 20%,transparent)}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.amt.pos{color:var(--green)}.amt.mut{color:var(--text3)}
.empty{padding:22px 16px;text-align:center;color:var(--text3);font-size:15px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:0 0 22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 22px}
.grid2 .tile{margin:0}
.tile{background:var(--card);border-radius:14px;padding:12px 14px}
.tile .k{font-size:13px;color:var(--text3)}.tile .v{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .v.sm{font-size:18px}
.hero{display:flex;gap:18px;align-items:center}
.ringwrap{position:relative;flex:none}
.ring{width:132px;height:132px;transform:rotate(-90deg);display:block}
.ring-bg{fill:none;stroke:var(--fill);stroke-width:14}
.ring-fg{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dasharray .5s}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 14px}
.ringtxt b{font-size:19px;font-variant-numeric:tabular-nums;line-height:1.1}.ringtxt span{font-size:12px;color:var(--text3)}
.hero .side{flex:1;min-width:0;display:grid;gap:10px}
.hero .side .k{font-size:12px;color:var(--text3)}.hero .side .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;background:var(--card);border-radius:12px;padding:2px}
.daynav button{border:0;background:none;color:var(--blue);font-size:26px;width:46px;height:40px;cursor:pointer;border-radius:10px;line-height:1}
.daynav button:active{background:var(--fill)}
.daylabel{position:relative;font-weight:600;text-align:center;flex:1}
.daylabel input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.bar.lg{height:8px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin:0 0 16px}
.seg button{flex:1;border:0;background:transparent;font-size:13px;font-weight:500;padding:6px 4px;border-radius:7px;cursor:pointer;color:var(--text)}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .seg button.on{background:#636366}}
:root[data-theme=dark] .seg button.on{background:#636366}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;font-weight:600;background:var(--blue);color:#fff;cursor:pointer;margin:0 0 12px;text-align:center}
.btn:active{opacity:.7}.btn.gray{background:var(--fill);color:var(--blue)}.btn.red{background:var(--fill);color:var(--red)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:15px;margin:0}
.link{background:none;border:0;color:var(--blue);cursor:pointer;padding:6px 4px}.link:active{opacity:.5}.link.b{font-weight:600}
.btnrow{display:flex;gap:10px}.btnrow .btn{flex:1}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 -.5px 0 var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:760px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;color:var(--text3);font-size:10px;font-weight:500;border:0;background:none;cursor:pointer}
.tab.on{color:var(--blue)}.tab svg{width:26px;height:26px}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(68px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:34px;line-height:1;box-shadow:0 6px 20px rgba(0,122,255,.4);z-index:25;cursor:pointer;padding:0 0 3px}
.fab:active{transform:scale(.94)}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.overlay.top{z-index:200}
.sheet{--card:var(--card-s);background:var(--sheet);width:100%;max-width:560px;max-height:92vh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.8,.2,1);overflow:hidden}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:14px;max-height:88vh}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px;flex:none}
.sheet-h .link{min-width:64px;font-size:17px}.sheet-h .link.b{text-align:right}
.sheet-t{font-weight:600;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-b{overflow:auto;padding:8px 16px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
.action{width:100%;max-width:420px;padding:10px;animation:up .25s}
.action .box{background:var(--card-s);border-radius:14px;overflow:hidden;margin-bottom:8px}
.action .msg{padding:14px;text-align:center;font-size:13px;color:var(--text3)}
.action .abtn{display:block;width:100%;border:0;background:var(--card-s);padding:16px;font-size:20px;color:var(--blue);cursor:pointer}
.action .box .abtn{border-top:.5px solid var(--sep);color:var(--red)}
.action .abtn.cancel{border-radius:14px;font-weight:600}
.amtbox{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:6px 0 16px}
.amtbox input{border:0;background:transparent;font-size:46px;font-weight:700;text-align:center;width:100%;max-width:300px;color:var(--text);outline:none;padding:0;font-variant-numeric:tabular-nums}
.amtbox span{font-size:24px;color:var(--text3);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.qrow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 6px;scrollbar-width:none;touch-action:pan-x}.qrow::-webkit-scrollbar{display:none}
.qchip{position:relative;overflow:hidden;flex:none;display:flex;align-items:center;gap:6px;border:0;background:var(--card);color:var(--text);border-radius:18px;padding:9px 14px;font:inherit;font-size:15px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.qchip .qa{color:var(--text3);font-size:13px}.qchip.qadd{color:var(--blue);font-size:20px;line-height:1;padding:7px 16px}
.qchip::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--blue)}.qchip.hold::after{width:100%;transition:width 2s linear}
.toast button.link{pointer-events:auto}
.chips.two{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:max-content;justify-items:start;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:8px;padding:10px 12px 12px}
.chips.two::-webkit-scrollbar{display:none}
.catsearch{padding-bottom:0;min-height:40px}.catsearch input{text-align:left;text-align-last:left}
.chip.new{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.calh{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px}.calh b{font-size:17px;text-transform:capitalize}.calh button{border:0;background:var(--fill);width:34px;height:34px;border-radius:17px;font-size:18px;color:var(--blue);cursor:pointer}
.calsum{display:flex;gap:18px;padding:0 4px 12px;font-size:15px}.calsum .e{color:var(--red)}.calsum .i{color:var(--green)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}.cal .wd{text-align:center;font-size:11px;color:var(--text3);padding:2px 0}
.cal .d{border:0;font:inherit;color:var(--text);background:var(--fill);border-radius:10px;min-height:52px;padding:5px 1px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;line-height:1.15}
.cal .d .n{font-size:15px;font-weight:600}.cal .d .e,.cal .d .i{font-size:10px;font-weight:500;white-space:nowrap;letter-spacing:-.2px}.cal .d .e{color:var(--red)}.cal .d .i{color:var(--green)}
.cal .d.z{background:transparent;cursor:default}.cal .d.z .n{color:var(--text3);font-weight:400}.cal .d.o{background:transparent;cursor:default;visibility:hidden}
.cal .d.t .n{color:var(--blue)}.cal .d.sel{box-shadow:inset 0 0 0 2px var(--blue)}
.chip{border:0;background:var(--fill);border-radius:16px;padding:7px 12px;font-size:15px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);color:#fff}
.chip input{border:0;background:transparent;outline:none;width:110px;font:inherit;color:var(--text)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px}
.sw{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;box-shadow:0 0 0 2px var(--card),0 0 0 4px transparent}
.sw.cust{position:relative;overflow:hidden;background:conic-gradient(#ff453a,#ff9f0a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2,#ff453a);display:inline-block}

.sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--blue)}
.grid-cards{display:grid;grid-template-columns:1fr;gap:14px;margin:0 0 22px}
@media(min-width:600px){.grid-cards{grid-template-columns:1fr 1fr}}
.wcard{border-radius:18px;padding:16px;color:#fff;min-height:170px;position:relative;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.16);overflow:hidden}
.wcard::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.wcard:active{transform:scale(.985)}
.wcard .top{display:flex;justify-content:space-between;font-size:14px;font-weight:600;opacity:.92}
.wcard .big{font-size:30px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.wcard .sm{font-size:13px;opacity:.85}
.wcard .bar{background:rgba(255,255,255,.28);height:5px;margin:8px 0 5px}.wcard .bar>i{background:#fff}
.wcard .bot{display:flex;justify-content:space-between;font-size:13px;opacity:.9}
.g-blue{background:linear-gradient(135deg,#0a84ff,#5e5ce6)}.g-graphite{background:linear-gradient(135deg,#48484a,#1c1c1e)}
.g-green{background:linear-gradient(135deg,#30d158,#0a8f6a)}.g-orange{background:linear-gradient(135deg,#ff9f0a,#ff375f)}
.g-purple{background:linear-gradient(135deg,#bf5af2,#5e5ce6)}.g-teal{background:linear-gradient(135deg,#64d2ff,#0a84ff)}
.g-red{background:linear-gradient(135deg,#ff453a,#c2185b)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--text3);font-size:10px;font-family:inherit}
.chart .grid{stroke:var(--sep);stroke-width:.5}

.tip{font-size:13px;color:var(--text2);min-height:18px;margin-top:6px}

.badge.good{color:var(--green)}.badge.bad{color:var(--red)}.badge.warn{color:var(--orange)}
input[type=range]{width:100%;accent-color:var(--blue);margin:8px 0}
.big-out{font-size:22px;font-weight:700;letter-spacing:-.3px}

<script>
(()=>{'use strict';
/* ================= БАЗА ================= */
const LS='budget.v1', LSC='budget.cfg.v1';
const SCHEMA={
 transactions:['id','date','type','amount','category','accountId','toAccountId','debtId','note','updatedAt','deleted','toAmount'],
 accounts:['id','name','kind','opening','creditLimit','rate','minPayment','dueDay','last4','color','updatedAt','deleted','currency'],
 debts:['id','name','direction','total','opening','rate','minPayment','dueDay','note','updatedAt','deleted'],
 goals:['id','name','type','target','current','deadline','monthly','rate','linkedAccountId','debtIds','strategy','note','updatedAt','deleted'],
 settings:['key','value','updatedAt']};
const TABLES=['transactions','accounts','debts','goals'];
const NUMF=new Set(['amount','opening','creditLimit','rate','minPayment','dueDay','total','target','current','monthly','updatedAt','deleted','toAmount']);
let S={};try{S=JSON.parse(localStorage.getItem(LS))||{}}catch(e){}
S=Object.assign({transactions:[],accounts:[],debts:[],goals:[],settings:{},dirty:{}},S);
let CFG={url:'',token:''};try{CFG=Object.assign(CFG,JSON.parse(localStorage.getItem(LSC))||{})}catch(e){}
let INVITED='';
function parseInvite(str){try{const m=/[#&]?cfg=([A-Za-z0-9_-]+)/.exec(String(str||''));if(!m)return null;let b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
 const j=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))));
 if(j&&typeof j.u==='string'&&/^https:\/\//.test(j.u)&&typeof j.t==='string'&&j.t.length>=16)return{url:j.u,token:j.t}}catch(e){}return null}
try{const j=parseInvite(location.hash);if(j){CFG=j;localStorage.setItem(LSC,JSON.stringify(CFG));INVITED='1'}
 if(/cfg=/.test(location.hash))history.replaceState(null,'',location.pathname+location.search)}catch(e){}
const NEED_V=3;
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Не удалось сохранить локально')}};

/* ================= ТЕМА ================= */
function applyTheme(t){
 if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;
 const m=$$('meta[name=theme-color]');
 if(t==='light'||t==='dark'){m.forEach(x=>{x.media='all';x.content=t==='dark'?'#000000':'#f2f2f7'})}
 else if(m.length>1){m[0].media='(prefers-color-scheme: light)';m[0].content='#f2f2f7';m[1].media='(prefers-color-scheme: dark)';m[1].content='#000000'}}
const getTheme=()=>{try{return localStorage.getItem('budget.theme')||'auto'}catch(e){return 'auto'}};
/* ================= УТИЛИТЫ ================= */
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;const n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const shiftMonth=(s,n)=>{const d=pd(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,dim(d.getFullYear(),d.getMonth())));return ymd(d)};
const plural=(n,f)=>{n=Math.abs(n)%100;const k=n%10;return n>10&&n<20?f[2]:k>1&&k<5?f[1]:k===1?f[0]:f[2]};
const lazyF=(C,o)=>{const m={};return {format:v=>{const l=LOC();return (m[l]||(m[l]=new C(l,o))).format(v)}}};
const nf=lazyF(Intl.NumberFormat,{maximumFractionDigits:2}),nf0=lazyF(Intl.NumberFormat,{maximumFractionDigits:0});
const setting=(k,d)=>{const s=S.settings[k];return s===undefined||s.value===undefined?d:s.value};
const cur=()=>setting('currency','₴');
const rateUnit=()=>setting('rateUnit','m');
const rateNum=a=>rateUnit()==='m'?Math.round(a/12*100)/100:a;
const rateShow=a=>a>0?(rateUnit()==='m'?rateNum(a)+'%/мес':rateNum(a)+'% год.'):'';
const money=(n,sign)=>{n=num(n);const a=Math.abs(n),s=(a>=100?nf0:nf).format(a);return (n<0?'−':sign&&n>0?'+':'')+s+' '+cur()};
const short=n=>{const a=Math.abs(n);if(a>=1e6)return (n/1e6).toFixed(a>=1e7?0:1).replace('.0','')+'M';if(a>=1e3)return (n/1e3).toFixed(a>=1e4?0:1).replace('.0','')+'k';return String(Math.round(n))};
const dtf=lazyF(Intl.DateTimeFormat,{weekday:'short',day:'numeric',month:'long'});
const dtfFull=lazyF(Intl.DateTimeFormat,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const mtf=lazyF(Intl.DateTimeFormat,{month:'long',year:'numeric'});
const monthName=d=>mtf.format(d).replace(/\s?(г|р)\.$/,'');
const wd=lazyF(Intl.DateTimeFormat,{weekday:'short'});
const mshort=lazyF(Intl.DateTimeFormat,{month:'short'});
const dayLabel=s=>{const t=today();return s===t?T('Сегодня'):s===addDays(t,-1)?T('Вчера'):s===addDays(t,1)?T('Завтра'):dtf.format(pd(s))};
const etaLabel=m=>{const d=new Date();d.setMonth(d.getMonth()+m);return monthName(d)};
const durLabel=m=>{const y=Math.floor(m/12),r=m%12;return (y?y+' '+PLT(y,['год','года','лет'])+' ':'')+(r?r+' мес.':'')||'0 мес.'};
const monthsUntil=s=>{const a=new Date(),b=pd(s);return Math.max(1,(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()+(b.getDate()>=a.getDate()?0:-1))};
let toastT;function toast(t){$$('.toast').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);clearTimeout(toastT);toastT=setTimeout(()=>e.remove(),2200)}

/* ================= ДАННЫЕ ================= */
let CACHE=null,PNC={};
const live=t=>S[t].filter(x=>!x.deleted);
function toastAct(t,label,fn){$$('.toast').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast';e.style.pointerEvents='auto';e.innerHTML='<span>'+esc(t)+'</span> <button class="link" style="margin-left:10px;font-weight:600">'+esc(label)+'</button>';e.querySelector('button').onclick=()=>{fn();e.remove()};document.body.appendChild(e);clearTimeout(toastT);toastT=setTimeout(()=>e.remove(),4500)}
const byId=(t,id)=>S[t].find(x=>x.id===id&&!x.deleted);
function save(t,o){o.updatedAt=Date.now();o.deleted=0;const i=S[t].findIndex(x=>x.id===o.id);if(i>=0)S[t][i]=o;else S[t].push(o);S.dirty[t+':'+o.id]=1;CACHE=null;persist();scheduleSync()}
function del(t,id){const o=S[t].find(x=>x.id===id);if(!o)return;o.deleted=1;o.updatedAt=Date.now();S.dirty[t+':'+id]=1;CACHE=null;persist();scheduleSync()}
function setSetting(k,v){PNC={};S.settings[k]={value:v,updatedAt:Date.now()};S.dirty['settings:'+k]=1;persist();scheduleSync()}
const CSYM={USD:'$',EUR:'€',GBP:'£',PLN:'zł'},CCODES=['USD','EUR'];
function ratesStore(){try{return JSON.parse(localStorage.getItem('budget.rates'))||{}}catch(e){return {}}}
function rateOf(code){if(!code)return 1;const r=ratesStore(),m=num((r.manual||{})[code]),a=num((r.auto||{})[code]);return m>0?m:a>0?a:0}
const accCur=id=>{const a=id&&byId('accounts',id);return a&&a.currency?a.currency:''};
const toBase=(code,n)=>code?n*rateOf(code):n;
const cvt=t=>toBase(accCur(t.accountId),num(t.amount));
function moneyC(n,code,sign){if(!code)return money(n,sign);n=num(n);const a=Math.abs(n),s=(a>=100?nf0:nf).format(a);return (n<0?'−':sign&&n>0?'+':'')+s+' '+(CSYM[code]||code)}
function compute(){
 const bal={},rem={},dir={};
 live('accounts').forEach(a=>bal[a.id]=num(a.opening));
 live('debts').forEach(d=>{rem[d.id]=num(d.opening);dir[d.id]=d.direction});
 for(const t of live('transactions')){const a=num(t.amount);
  if(t.type==='expense'){if(t.accountId in bal)bal[t.accountId]-=a}
  else if(t.type==='income'){if(t.accountId in bal)bal[t.accountId]+=a}
  else if(t.type==='transfer'){if(t.accountId in bal)bal[t.accountId]-=a;if(t.toAccountId in bal){let ta=num(t.toAmount);if(!(ta>0)){const sc=accCur(t.accountId),dc=accCur(t.toAccountId);ta=sc===dc?a:(rateOf(sc)&&rateOf(dc)?a*rateOf(sc)/rateOf(dc):a)}bal[t.toAccountId]+=ta}}
  else if(t.type==='adjust'){if(t.accountId in bal)bal[t.accountId]+=a}
  else if(t.type==='debtpay'){if(t.debtId in rem)rem[t.debtId]-=a;if(t.accountId in bal)bal[t.accountId]+=dir[t.debtId]==='lent'?a:-a;if(!(t.debtId in rem)&&t.toAccountId in bal)bal[t.toAccountId]+=a}}
 return {bal,rem}}
const C=()=>CACHE||(CACHE=compute());
const txOn=(a,b)=>live('transactions').filter(t=>t.date>=a&&t.date<=b);
const sumT=(l,type)=>l.reduce((s,t)=>t.type===type?s+cvt(t):s,0);
const cmpTx=(x,y)=>y.date.localeCompare(x.date)||(y.id>x.id?1:-1);
const accName=id=>{const a=byId('accounts',id);return a?a.name:''};
const isSav=id=>{const a=byId('accounts',id);return !!a&&a.kind==='savings'};
function liabilities(){const out=[];
 live('debts').filter(d=>d.direction!=='lent').forEach(d=>{const r=C().rem[d.id];if(r>0.005)out.push({key:'d:'+d.id,id:d.id,kind:'debt',name:d.name,bal:r,apr:num(d.rate),min:num(d.minPayment),dueDay:num(d.dueDay)})});
 live('accounts').filter(a=>a.kind==='credit').forEach(a=>{const b=-C().bal[a.id];if(b>0.005)out.push({key:'a:'+a.id,id:a.id,kind:'card',name:a.name,bal:b,apr:num(a.rate),min:num(a.minPayment),dueDay:num(a.dueDay)})});
 return out}
function nextDue(day){const t=pd(today());let y=t.getFullYear(),m=t.getMonth();let dt=new Date(y,m,Math.min(day,dim(y,m)));if(dt<t){m++;if(m>11){m=0;y++}dt=new Date(y,m,Math.min(day,dim(y,m)))}return {date:ymd(dt),days:Math.round((dt-t)/864e5)}}
function upcoming(days){return liabilities().filter(l=>l.dueDay>0).map(l=>Object.assign({},l,nextDue(l.dueDay))).filter(x=>x.days<=days).sort((a,b)=>a.days-b.days)}

/* ================= КАТЕГОРИИ ================= */
const EXP=[['Продукты','🛒','--green'],['Кафе и рестораны','☕','--orange'],['Транспорт','🚕','--yellow'],['Коммунальные услуги','💡','--indigo'],['Аренда жилья','🏠','--brown'],['Подписки и связь','📱','--teal'],['Здоровье','💊','--red'],['Красота и уход','💅','--pink'],['Одежда и обувь','👕','--purple'],['Дом и быт','🧺','--mint'],['Образование','🎓','--blue'],['Дети','🧸','--cyan'],['Досуг','🎬','--orange'],['Подарки','🎁','--pink'],['Путешествия','✈️','--teal'],['Домашние животные','🐾','--brown'],['Бизнес и реклама','📣','--indigo'],['Комиссии банков','🏦','--gray'],['Благотворительность','🤝','--green'],['Прочее','📦','--gray']];
const INC=[['Зарплата','💼','--green'],['Бизнес и проекты','🚀','--blue'],['Фриланс и подработка','🧑‍💻','--teal'],['Премии и бонусы','🏆','--yellow'],['Кэшбек','💳','--mint'],['Денежные подарки','🎁','--pink'],['Продажа вещей','🏷️','--orange'],['Доход от аренды','🏘️','--brown'],['Проценты и дивиденды','📈','--indigo'],['Возврат','↩️','--cyan'],['Прочее','💰','--gray']];
const HASHC=['--blue','--green','--orange','--purple','--pink','--teal','--indigo','--brown','--mint','--red'];
function catInfo(name,type){const L=type==='income'?INC:EXP;const f=L.find(c=>c[0]===name)||EXP.find(c=>c[0]===name)||INC.find(c=>c[0]===name);
 if(f)return {icon:f[1],color:'var('+f[2]+')'};let h=0;for(const ch of name||'')h=(h*31+ch.charCodeAt(0))>>>0;return {icon:'🏷️',color:'var('+HASHC[h%HASHC.length]+')'}}
const hiddenCats=()=>new Set(setting('hiddenCats',[]));
const catsAll=t=>(t==='income'?INC:EXP).map(c=>c[0]).concat(customCats(t));
const catList=(t,keep)=>{const h=hiddenCats();return catsAll(t).filter(n=>!h.has(t+':'+n)||n===keep)};
const customCats=t=>setting('customCats',[]).filter(c=>c.t===t).map(c=>c.n);
const GP={blue:['#0a84ff','#5e5ce6'],graphite:['#48484a','#1c1c1e'],green:['#30d158','#0a8f6a'],orange:['#ff9f0a','#ff375f'],purple:['#bf5af2','#5e5ce6'],teal:['#64d2ff','#0a84ff'],red:['#ff453a','#c2185b'],
 pink:['#ff4d8d','#d6336c'],burgundy:['#b0173f','#5a0f2e'],coral:['#ff7a59','#e8505b'],gold:['#d9a21b','#a3640b'],lime:['#8fc31f','#3a9d23'],mint:['#2ec4a6','#0f8f7e'],emerald:['#12a05f','#065f46'],forest:['#2e7d4f','#14452f'],
 sky:['#3ab0ff','#2563eb'],navy:['#1f4fbf','#0b1f5c'],indigo:['#5b5bd6','#312e81'],violet:['#8b5cf6','#5b21b6'],lavender:['#a78bfa','#7c5cd6'],plum:['#a23b8f','#4c1d5f'],brown:['#9a6b4a','#4a2c1a'],slate:['#64748b','#334155'],black:['#2b2b2e','#000000']};
const GR=Object.keys(GP);
(function(){const st=document.createElement('style');st.textContent=GR.map(k=>`.g-${k}{background:linear-gradient(135deg,${GP[k][0]},${GP[k][1]})}`).join('');document.head.appendChild(st)})();
const isHex=c=>/^#[0-9a-fA-F]{6}$/.test(c||'');
function hexGrad(h){const n=parseInt(h.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255,mx=Math.max(r,g,b)/255,mn=Math.min(r,g,b)/255,l=(mx+mn)/2,d=mx-mn;
 let hh=0,ss=0;if(d){ss=d/(1-Math.abs(2*l-1));const R=r/255,G=g/255,B=b/255;hh=mx===R?((G-B)/d)%6:mx===G?(B-R)/d+2:(R-G)/d+4;hh=(hh*60+360)%360}
 const l1=Math.min(.55,l),c1=`hsl(${hh.toFixed(0)},${(ss*100).toFixed(0)}%,${(l1*100).toFixed(0)}%)`,c2=`hsl(${((hh+22)%360).toFixed(0)},${(Math.min(1,ss)*100).toFixed(0)}%,${(l1*55).toFixed(0)}%)`;
 return `linear-gradient(135deg,${c1},${c2})`}
const gCls=c=>isHex(c)?'':'g-'+(GP[c]?c:'blue'),gSty=c=>isHex(c)?`style="background:${hexGrad(c)}"`:''
const KIND={debit:'Дебетовая карта',credit:'Кредитная карта',cash:'Наличные',savings:'Накопительный счёт'};

/* ================= ГРАФИКИ ================= */
const niceMax=v=>{if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p};
let chartSeq=0;
function barChart(o){
 const W=640,H=o.h||190,L=40,R=6,T=10,B=22,n=o.labels.length,iw=W-L-R,ih=H-T-B,id='tip'+(++chartSeq);
 const mx=niceMax(Math.max(1,...o.series.flatMap(s=>s.values),o.hline||0));
 const gw=iw/Math.max(n,1),ns=o.series.length,bw=Math.min(26,gw*0.74/ns);
 let g='';[0,.5,1].forEach(k=>{const y=T+ih*(1-k);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${short(mx*k)}</text>`});
 const step=Math.ceil(n/12);let bars='',lab='',hits='';
 for(let i=0;i<n;i++){
  const x0=L+gw*i+(gw-bw*ns-(ns-1)*2)/2;const dim_=o.sel!=null&&o.sel!==i;
  o.series.forEach((s,j)=>{const v=s.values[i]||0,h=v/mx*ih;if(v>0)bars+=`<rect x="${(x0+j*(bw+2)).toFixed(1)}" y="${(T+ih-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="${Math.min(4,bw/2).toFixed(1)}" style="fill:${s.color};opacity:${dim_?.4:1}"/>`});
  if(i%step===0)lab+=`<text x="${(L+gw*i+gw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(o.labels[i])}</text>`;
  const tip=o.fullLabels?o.fullLabels[i]:o.labels[i];

 let hl='';if(o.hline){const y=T+ih*(1-o.hline/mx);hl=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--orange)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R}" y="${y-4}" text-anchor="end" style="fill:var(--orange)">${esc(o.hlabel||'лимит')}</text>`}

function lineChart(o){
 const W=640,H=o.h||190,L=44,R=10,T=10,B=22,iw=W-L-R,ih=H-T-B;
 const n=Math.max(...o.series.map(s=>s.values.length),2),all=o.series.flatMap(s=>s.values).concat(o.target!=null?[o.target]:[]);
 let mx=Math.max(0,...all),mn=Math.min(0,...all);mx=niceMax(mx||1);mn=mn<0?-niceMax(-mn):0;const rg=mx-mn||1;
 const X=i=>L+iw*i/(n-1),Y=v=>T+ih*(1-(v-mn)/rg);
 let g='';[0,.5,1].forEach(k=>{const v=mn+rg*k,y=Y(v);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${short(v)}</text>`});
 let xl='';const seen=new Set();for(let k=0;k<=4;k++){const i=Math.round((n-1)*k/4);if(seen.has(i))continue;seen.add(i);xl+=`<text x="${X(i)}" y="${H-6}" text-anchor="${k===0?'start':k===4?'end':'middle'}">${esc(o.xlabel(i))}</text>`}
 let paths='';o.series.forEach((s,si)=>{const pts=s.values.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1));if(pts.length<1)return;
  if(o.area&&si===0)paths+=`<path d="M${X(0)},${Y(0)} L${pts.join(' L')} L${X(s.values.length-1)},${Y(0)}Z" style="fill:${s.color};opacity:.12"/>`;
  paths+=`<polyline points="${pts.join(' ')}" fill="none" style="stroke:${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
  if(s.values.length===1)paths+=`<circle cx="${X(0)}" cy="${Y(s.values[0])}" r="4" style="fill:${s.color}"/>`});
 let tg='';if(o.target!=null){const y=Y(o.target);tg=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R}" y="${y-4}" text-anchor="end" style="fill:var(--green)">${esc(o.tlabel||'цель')}</text>`}
 const zero=mn<0?`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--text3)" stroke-width=".8"/>`:'';
 const id='tip'+(++chartSeq);let hits='';const hw=iw/(n-1);
 for(let i=0;i<n;i++)hits+=`<rect class="hit" x="${(X(i)-hw/2).toFixed(1)}" y="${T}" width="${hw.toFixed(1)}" height="${ih}" data-tipid="${id}" data-tip="${esc(o.xlabel(i)+' · '+o.series.map(s=>(o.series.length>1?s.name+' ':'')+(s.values[i]==null?'—':money(s.values[i]))).join(' · '))}"/>`;
 const legend=o.series.length>1?`<div class="legend">${o.series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${zero}${tg}${paths}${xl}${hits}</svg><div class="tip" id="${id}">${esc(o.tip0||'Нажмите на график, чтобы увидеть значение')}</div>${legend}`}
function donut(items,label){
 const total=items.reduce((s,i)=>s+i.value,0);if(total<=0)return '';const r=42,Cc=2*Math.PI*r;let acc=0,seg='';
 items.forEach(it=>{const len=it.value/total*Cc,gap=items.length>1?1.4:0;seg+=`<circle cx="60" cy="60" r="${r}" fill="none" stroke-width="14" style="stroke:${it.color}" stroke-dasharray="${Math.max(len-gap,.1).toFixed(2)} ${(Cc-len+gap).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}"/>`;acc+=len});
 return `<div class="donutwrap"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke-width="14" style="stroke:var(--fill)"/><g transform="rotate(-90 60 60)">${seg}</g><text x="60" y="61" text-anchor="middle" class="dtxt-a">${short(total)}</text><text x="60" y="73" text-anchor="middle" class="dtxt-b">${esc(label||'')}</text></svg></div>`}

function donutOf(map,type,label){

/* ===== Автоперевод интерфейса (фразы → UA/EN) ===== */
const CYR=/[А-Яа-яЁё]/,PHC={};
const PHR=[[/(\d+)\s*мес\./g,['$1 міс.','$1 mo.']],[/\/мес/g,['/міс','/mo']],[/%\s*год\./g,['% річних','% p.a.']],[/до (\d+)-го/g,['до $1-го','by the $1th']],[/(\d+)-(?:е|го)(?![А-Яа-я])/g,['$&','$1']],[/(\d+) дн\./g,['$1 дн.','$1 d']],[/(^|\s)из(?=\s|$)/g,['$1з','$1of']],[/(^|[\s·])мин\.(?=\s)/g,['$1мін.','$1min.']],[/(^|[\s·])до (?=[A-Za-zА-Яа-я])/g,['$1строк: ','$1by ']],[/% к /g,['% до ','% vs ']],[/ дни\)/g,[' дні)',' days)']],[/(^|[\s·])план (?=\d)/g,['$1план ','$1plan ']],[/срок: /g,['строк: ','due ']],[/(^|\s)на (?=\d+ (?:міс|mo))/g,['$1на ','$1']]];
function phComp(l){if(PHC[l])return PHC[l];const idx=l==='ua'?0:1,m=new Map(),ex=new Map();
 const lo=s=>s.charAt(0).toLowerCase()+s.slice(1),up=s=>s.charAt(0).toUpperCase()+s.slice(1);
 const add=(k,v)=>{if(/%\d|%s/.test(k)){return}(k.length<5?ex:m).set(k,v)};
 for(const src of [DICT,PH])for(const k in src){const v=src[k][idx];if(!v||k.includes('|'))continue;add(k,v);
  if(k.length>1&&k[1]===k[1].toLowerCase()&&v.length>1&&v[1]===v[1].toLowerCase()){const a=lo(k),b=up(k);if(a!==k&&!(a in src))add(a,lo(v));if(b!==k&&!(b in src))add(b,up(v))}}
 const keys=[...m.keys()].sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&'));
 return PHC[l]={m,ex,re:new RegExp('(^|[^А-Яа-яЁё])('+keys.join('|')+')(?![А-Яа-яЁё])','g')}}
function trS(s,l){if(!CYR.test(s))return s;const R=phComp(l),t=s.trim(),e=R.ex.get(t);if(e)return s.replace(t,e);
 const t2=t.replace(/^[^А-Яа-яЁёA-Za-z]+/,''),e2=t2!==t&&R.ex.get(t2);if(e2)return s.replace(t2,e2);
 let r=s;if(r.includes(' · '))r=r.split(' · ').map(p=>{const q=p.trim().replace(/^[^А-Яа-яЁёA-Za-z]+/,'');return R.ex.has(q)?p.replace(q,R.ex.get(q)):p}).join(' · ');
 r=r.replace(R.re,(x,p,k)=>p+(R.m.get(k)||k));
 for(const [re,v] of PHR)r=r.replace(re,v[l==='ua'?0:1]);
 return r}
const TRM=new WeakMap();
function trVal(h,key,cur,l){let m=TRM.get(h);const e=m&&m[key];const src=(e&&cur===e.out)?e.src:cur;const out=l==='ru'?src:trS(src,l);
 if(out!==src){if(!m){m={};TRM.set(h,m)}m[key]={src,out}}else if(m)delete m[key];return out}
function trAttrs(n,l){for(const a of ['placeholder','aria-label','title'])if(n.hasAttribute(a)){const v=n.getAttribute(a);const m=TRM.get(n);if(CYR.test(v)||(m&&m['a:'+a])){const r=trVal(n,'a:'+a,v,l);if(r!==v)n.setAttribute(a,r)}}}
function trNode(n,l){if(n.nodeType===3){const p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName))return;const v=n.nodeValue,m=TRM.get(n);if(!CYR.test(v)&&!(m&&m.t))return;const r=trVal(n,'t',v,l);if(r!==v)n.nodeValue=r;return}
 if(n.nodeType!==1||/^(SCRIPT|STYLE)$/.test(n.nodeName))return;trAttrs(n,l);n.childNodes.forEach(c=>trNode(c,l))}
let trLang=null;
let TRO=null,trBusy=false;
function trStart(){if(TRO||!document.body)return;
 TRO=new MutationObserver(ms=>{const l=getLang();if(l==='ru'||trBusy)return;trBusy=true;
  try{for(const m of ms){if(m.type==='childList')m.addedNodes.forEach(n=>trNode(n,l));else if(m.type==='characterData')trNode(m.target,l);else trAttrs(m.target,l)}}finally{trBusy=false;TRO.takeRecords()}});
 TRO.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']});
 trLang=getLang();if(trLang!=='ru')trNode(document.body,trLang)}

["Гід завжди під рукою","<p>Значок <b>«?»</b> запускає цей гід знову. Його ж можна знайти в налаштуваннях, там само вмикається показ при кожному вході.</p><p>Приємного користування!</p>"]

en:[
["Welcome to Seyfa","<p>This is a personal budget tracker. You can keep track of:</p><ul><li><b>expenses and income</b> by day</li><li><b>cards and credit limits</b></li><li><b>debts</b> and repayment schedules</li><li><b>goals</b> and savings</li><li><b>statistics</b> with charts</li></ul><p>Data is stored in your browser and can optionally sync with a Google Sheet. The guide takes about a minute.</p>"],
["Five sections","<p>Navigation at the bottom:</p><ul><li><b>Today</b> — daily budget and transactions</li><li><b>Accounts</b> — cards and balances</li><li><b>Debts</b> — loans and borrowings</li><li><b>Goals</b> — savings and debt payoff</li><li><b>Statistics</b> — charts and totals</li></ul>"],
["The “+” button — new transaction","<p>Available on every screen. Four transaction types:</p><ul><li><b>Expense</b></li><li><b>Income</b></li><li><b>Transfer</b> between your own accounts (a credit card payment is also a transfer)</li><li><b>Debt</b> — a loan payment or a repayment to you</li></ul><p>Any transaction can be opened, edited or deleted.</p>"],
["Choosing a day","<p>The <b>‹ ›</b> arrows flip through days.</p><p>Tap the date to pick any day in the calendar and view or add its transactions.</p>"],
["Daily budget","<p>The ring shows <b>how much you can still spend today</b>.</p><p>Unspent limit carries over to the next day, and overspending is deducted.</p><p>Ring color:</p><ul><li><b>green</b> — fine</li><li><b>orange</b> — close to the limit</li><li><b>red</b> — limit exceeded</li></ul>"],
["Quick expenses","<p>Buttons for frequent expenses, e.g. “Coffee”.</p><ul><li><b>Tap</b> — record the expense at the saved price</li><li><b>Hold for 2 seconds</b> — change the price</li><li><b>“＋”</b> — create your own button</li></ul><p>Right after recording you can tap “Undo”.</p>"],
["Monthly plan","<p>Enter:</p><ul><li>income</li><li>mandatory expenses</li><li>debt payments</li><li>savings</li></ul><p>The app will calculate <b>free money and the daily budget</b>.</p><p>Spending in planned categories follows the plan and doesn’t reduce the daily limit. Without a plan, the limit from settings applies.</p>"],
["Cards and accounts","<p>The <b>“Add”</b> button creates a card or account: debit, credit, cash, savings.</p><p>For a credit card, enter:</p><ul><li>limit</li><li>rate</li><li>minimum payment</li><li>payment day</li></ul><p>The app shows the debt, available balance and the next payment.</p>"],
["Accounts summary","<p>At the top — money in accounts, total credit card debt and available limits.</p><p>Tap a card to:</p><ul><li>edit its details</li><li><b>adjust the balance</b> manually (not income or expense)</li><li>view recent transactions</li></ul>"],
["Debts","<p>Two lists:</p><ul><li><b>“I owe”</b> — loans and borrowings</li><li><b>“Owed to me”</b> — what others owe you</li></ul><p>Enter the balance, rate (monthly or yearly), payment and payment day.</p><p>The <b>“Make a payment”</b> button on a debt reduces the balance and deducts money from an account.</p>"],
["Debts summary","<p>At the top:</p><ul><li>how much you owe</li><li>how much is owed to you</li><li>minimum payments per month</li><li><b>net worth</b></li></ul><p>Below — upcoming payments for two weeks and payoff progress for each debt.</p>"],
["Goals","<p>Two kinds of goals:</p><ul><li><b>“Save up”</b> — amount, deadline (date or months), contribution, yield; you can link a savings account</li><li><b>“Pay off debts”</b> — choose debts and a repayment budget</li></ul>"],
["Savings goal","<p>Open a goal. You’ll see:</p><ul><li>a <b>contribution simulator</b> with a slider</li><li>strategy options</li><li>sources of money for the contribution</li></ul><p>“Save as my plan” remembers your choice.</p>"],
["Debt payoff goal","<p>Three strategies:</p><ul><li><b>“Avalanche”</b> — highest rate first</li><li><b>“Snowball”</b> — smallest first</li><li><b>“Minimum only”</b> — baseline comparison</li></ul><p>Also: a balance chart, a repayment table (CSV) and “what if I pay more” scenarios.</p>"],
["Statistics period","<p>Switch between <b>Day, Month and Year</b>.</p><p>The ‹ › arrows move the period back and forward.</p>"],
["Summary tiles","<p>The tiles show:</p><ul><li>spending (compared with the previous period)</li><li>income</li><li>result and savings rate</li><li>debt payments</li><li><b>opening and closing balance</b> of the period</li></ul>"],
["Charts and categories","<p>Tap a bar or chart point to see the value.</p><p>Below:</p><ul><li>a donut chart of spending by category</li><li>income sources</li><li>spending by account</li><li>largest expenses</li></ul>"],
["Sync","<p>The cloud exchanges data with your Google Sheet. Dot color:</p><ul><li><b>gray</b> — not set up or waiting</li><li><b>blue</b> — syncing</li><li><b>green</b> — all synced</li><li><b>red</b> — error (tap to retry)</li></ul><p>Without a connection, data stays only in this browser.</p>"],
["Settings","<p>Here:</p><ul><li>theme: auto, light, dark</li><li>rates: monthly or yearly</li><li>currency and daily limit</li><li>Google Sheet connection</li><li>JSON export and import, demo data</li></ul>"],
["The guide is always at hand","<p>The <b>“?”</b> icon starts this guide again. You can also find it in settings, where you can turn on showing it at every launch.</p><p>Enjoy!</p>"]
]};
const zoneOf=(f,p)=>{const r=p>0?f/p:0;return r>1?{color:'var(--red)',label:'лимит превышен'}:r>=.8?{color:'var(--orange)',label:'осталось совсем немного'}:r>=.5?{color:'var(--yellow)',tx:'#b78a00',label:'потрачена заметная часть'}:{color:'var(--green)',label:'можно тратить'}};
const TABS=[['today','Сегодня'],['accounts','Счета'],['debts','Долги'],['goals','Цели'],['stats','Статистика']];

/* ================= ЭКРАНЫ ================= */
const getPlan=ym=>setting('plan:'+ym,null);
function planCalc(p){const t=k=>(p[k]||[]).reduce((s,r)=>s+num(r.a),0),inc=t('inc'),exp=t('exp'),debt=t('debt'),sav=t('sav');return {inc,exp,debt,sav,free:inc-exp-debt-sav}}
const monthLimit=ym=>{const p=getPlan(ym);if(p){const [y,m]=ym.split('-').map(Number);return Math.max(0,planCalc(p).free/dim(y,m-1))}return num(setting('dailyLimit',0))};
const nk=s=>String(s||'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');
function planNames(ym){if(PNC[ym])return PNC[ym];const p=getPlan(ym);return PNC[ym]=p?new Set((p.exp||[]).filter(r=>r.n&&num(r.a)>0).map(r=>nk(r.n))):new Set()}
function budgetRows(ym){const p=getPlan(ym);if(!p)return [];const [y,m]=ym.split('-').map(Number),tx=txOn(ym+'-01',ym+'-'+pad(dim(y,m-1))).filter(t=>t.type==='expense');
 return (p.exp||[]).filter(r=>r.n&&num(r.a)>0).map(r=>{const f=tx.filter(t=>nk(t.category||'Прочее')===nk(r.n)).reduce((a,t)=>a+cvt(t),0),pl=num(r.a);return {n:r.n,p:pl,f,pct:f/pl}})}
function budgetMsg(o){if(!o||o.type!=='expense'||!o.category||!o.date)return '';const r=budgetRows(o.date.slice(0,7)).find(x=>nk(x.n)===nk(o.category));if(!r)return '';
 const before=(r.f-num(o.amount))/r.p;if(before<1&&r.pct>=1)return TT('%1: план превышен на %2',cn(r.n),money(r.f-r.p));if(before<.8&&r.pct>=.8)return TT('%1: израсходовано %2% плана',cn(r.n),Math.round(r.pct*100));return ''}
function budgetAlerts(ym){const rows=budgetRows(ym).filter(r=>r.pct>=.8).sort((a,b)=>b.pct-a.pct).slice(0,3);
 return rows.map(r=>r.pct>=1?`<div class="note" style="margin-top:-10px;color:var(--red)">🔴 ${esc(TT('%1: план превышен на %2 (%3 из %4)',cn(r.n),money(r.f-r.p),money(r.f),money(r.p)))}</div>`:`<div class="note" style="margin-top:-10px;color:var(--orange)">🟠 ${esc(TT('%1: %2% плана (%3 из %4)',cn(r.n),Math.round(r.pct*100),money(r.f),money(r.p)))}</div>`).join('')}
/* Сколько траты уходит в дневной лимит: вне плана — вся сумма; по категории плана — только часть сверх плана (в день, когда порог пройден) */
function overMap(ym){const key='o:'+ym;if(PNC[key])return PNC[key];const p=getPlan(ym),lim=new Map(),res=new Map(),run=new Map();
 ((p&&p.exp)||[]).forEach(r=>{if(r.n&&num(r.a)>0)lim.set(nk(r.n),(lim.get(nk(r.n))||0)+num(r.a))});
 const [y,m]=ym.split('-').map(Number);
 txOn(ym+'-01',ym+'-'+pad(dim(y,m-1))).filter(t=>t.type==='expense').sort((a,b)=>a.date.localeCompare(b.date)||(a.id>b.id?1:a.id<b.id?-1:0)).forEach(t=>{
  const k=nk(t.category||'Прочее');if(!lim.has(k))return;const a=cvt(t),before=run.get(k)||0,P=lim.get(k);
  res.set(t.id,Math.max(0,Math.min(a,before+a-P)));run.set(k,before+a)});
 return PNC[key]=res}
const cAmt=t=>{if(t.type!=='expense')return 0;const ym=t.date.slice(0,7);return planNames(ym).has(nk(t.category||'Прочее'))?(overMap(ym).get(t.id)||0):cvt(t)};
const counted=t=>cAmt(t)>0;
const sumC=l=>l.reduce((s,t)=>s+cAmt(t),0);
function totalAt(date){const acc=new Set(live('accounts').map(a=>a.id)),dir={};live('debts').forEach(d=>dir[d.id]=d.direction);let tot=live('accounts').reduce((s,a)=>s+toBase(a.currency||'',num(a.opening)),0);
 for(const t of live('transactions')){if(t.date>date||!acc.has(t.accountId))continue;const a=cvt(t);if(t.type==='income'||t.type==='adjust')tot+=a;else if(t.type==='expense')tot-=a;else if(t.type==='debtpay'&&!acc.has(t.toAccountId))tot+=dir[t.debtId]==='lent'?a:-a}return tot}
function txMeta(t){
 const a=num(t.amount);
 if(t.type==='transfer')return {icon:'⇄',color:'var(--gray)',title:T('Перевод'),sub:[accName(t.accountId)+' → '+accName(t.toAccountId),t.note].filter(Boolean).join(' · '),amt:moneyC(a,accCur(t.accountId)),cls:'mut'};
 if(t.type==='debtpay'&&t.toAccountId&&!t.debtId){return {icon:'💳',color:'var(--indigo)',title:T('Платёж по карте: ')+accName(t.toAccountId),sub:[accName(t.accountId),t.note].filter(Boolean).join(' · '),amt:'−'+money(a),cls:''}}
 if(t.type==='debtpay'){const d=byId('debts',t.debtId);const lent=d&&d.direction==='lent';return {icon:'💸',color:'var(--indigo)',title:(lent?T('Возврат долга: '):T('Платёж: '))+(d?d.name:T('долг')),sub:[accName(t.accountId),t.note].filter(Boolean).join(' · '),amt:(lent?'+':'−')+money(a),cls:lent?'pos':''}}
 if(t.type==='adjust')return {icon:'✎',color:'var(--gray)',title:T('Корректировка баланса'),sub:[accName(t.accountId),t.note].filter(Boolean).join(' · '),amt:moneyC(a,accCur(t.accountId),true),cls:'mut'};
 const ci=catInfo(t.category,t.type);const inc=t.type==='income';
 return {icon:ci.icon,color:ci.color,title:t.category?cn(t.category):T(inc?'Доход':'Расход'),sub:[accName(t.accountId)||T('Без счёта'),t.note].filter(Boolean).join(' · '),amt:(inc?'+':'−')+moneyC(a,accCur(t.accountId)),cls:inc?'pos':''}}
function txRow(t,withDate){const m=txMeta(t);
 return `<div class="row ico tap swp" data-act="editTx" data-id="${t.id}"><div class="ic" style="--c:${m.color}">${m.icon}</div><div class="grow"><div class="ell">${esc(m.title)}</div><div class="sub ell">${withDate?esc(dtf.format(pd(t.date)))+(m.sub?' · ':''):''}${esc(m.sub)}</div></div><div class="amt ${m.cls}">${m.amt}</div><button class="sdel" data-act="swDel" data-id="${t.id}" tabindex="-1">${T('Удалить')}</button></div>`}

function upcomingBlock(days,title){const up=upcoming(days);if(!up.length)return '';
 return `<div class="group-title">${title}</div><div class="group">${up.map(u=>`<div class="row ico tap" data-act="${u.kind==='card'?'editAcc':'editDebt'}" data-id="${u.id}"><div class="ic" style="--c:var(--orange)">🗓️</div><div class="grow"><div class="ell">${esc(u.name)}</div><div class="sub">${u.days===0?T('сегодня'):u.days===1?T('завтра'):TT('через %1 %2',u.days,PLT(u.days,['день','дня','дней']))} · ${dtf.format(pd(u.date))}</div></div><div class="amt">${u.min>0?money(u.min):'—'}</div></div>`).join('')}</div>`}

function viewToday(){
 const d=TD.date,txs=txOn(d,d).sort(cmpTx),expAll=sumT(txs,'expense'),exp=sumC(txs),inc=sumT(txs,'income');
 const dd=pd(d),dom=dd.getDate(),dm=dim(dd.getFullYear(),dd.getMonth()),ym=d.slice(0,7);
 const limit=monthLimit(ym),plan=getPlan(ym),pc=plan?planCalc(plan):null;
 const ms=ym+'-01',me=ym+'-'+pad(dm),mtx=txOn(ms,me);
 const mAll=sumC(mtx),before=sumC(mtx.filter(t=>t.date<=d))-exp;
 const avail=limit*dom-before,left=avail-exp,pct=avail>0?Math.min(1,exp/avail):(exp>0?1:0);
 const col=!limit?'var(--blue)':left<0?'var(--red)':exp>avail*.8?'var(--orange)':'var(--green)';
 const ring=`<div class="ringwrap"><svg viewBox="0 0 140 140" class="ring"><circle cx="70" cy="70" r="60" class="ring-bg"/><circle cx="70" cy="70" r="60" class="ring-fg" style="stroke:${col};stroke-dasharray:${(pct*377).toFixed(1)} 377"/></svg><div class="ringtxt">${limit>0?`<b style="color:${left<0?'var(--red)':'var(--text)'}">${money(Math.abs(left))}</b><span>${T(left<0?'перерасход':'осталось')}</span>`:`<b>${money(exp)}</b><span>${T('потрачено')}</span>`}</div></div>`;
 const side=limit>0?`<div><div class="k">${T('Базовый лимит на день')}</div><div class="v">${money(limit)}</div></div><div><div class="k">${T('Доступно сегодня (с переносом)')}</div><div class="v">${money(avail)}</div></div><div><div class="k">${T('Потрачено в лимите')}</div><div class="v">${money(exp)}</div></div>`
  :`<div class="k">${T('Составьте план месяца или задайте дневной лимит — приложение покажет, сколько можно потратить сегодня.')}</div><button class="btn sm" data-act="settings">${T('Задать лимит')}</button>`;
 const mlim=limit*dm;
 const hint=!limit?'':left<0?TT('Лимит исчерпан: перерасход %1 уменьшит доступную сумму следующих дней.',money(-left)):TT('Можно потратить ещё %1. Неиспользованный лимит переносится на следующий день.',money(left));
 const share=pc&&pc.inc>0?pc.free/pc.inc:null;
 const warn=pc&&pc.free<0?TT('План превышает доходы на %1.',money(-pc.free)):share!==null&&share<.2?T('Свободно меньше 20% дохода — дневного бюджета может не хватить.'):'';
 const pf=plan?(plan.exp||[]).filter(r=>r.n&&num(r.a)>0):[];
 const pfHtml=pf.length?`<div class="group-title">${T('План и факт по расходам')}</div><div class="group">${pf.map(r=>{const f=mtx.filter(t=>t.type==='expense'&&nk(t.category||'Прочее')===nk(r.n)).reduce((s,t)=>s+cvt(t),0),p=num(r.a),ci=catInfo(r.n);const zc=zoneOf(f,p);zc.tx=zc.tx||zc.color;return `<div class="row ico"><div class="ic" style="--c:${ci.color}">${ci.icon}</div><div class="grow"><div style="display:flex;justify-content:space-between;gap:8px"><span class="ell">${esc(cn(r.n))}</span><span class="amt" style="color:${zc.tx}">${money(f)} <span class="sub">/ ${money(p)}</span></span></div><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,f/p*100).toFixed(1)}%;background:${zc.color}"></i><u class="zk" style="left:50%"></u><u class="zk" style="left:80%"></u></div></div></div>`}).join('')}</div>`:'';
 const planRow=`<div class="group"><div class="row ico tap" data-act="plan" data-ym="${ym}"><div class="ic" style="--c:var(--indigo)">🗓️</div><div class="grow"><div>${T('План месяца')} · ${esc(monthName(dd))}</div><div class="sub">${plan?TT('свободно %1 · лимит %2/день',money(pc.free),money(limit)):T('доходы, платежи и накопления → дневной бюджет')}</div></div><div style="color:var(--text3)">›</div></div></div>`;
 return `<h1 class="large">${esc(dayLabel(d))}</h1>
 <div class="daynav"><button data-act="dayPrev" aria-label="Назад">‹</button><div class="daylabel">${esc(dtfFull.format(dd))}<input type="date" id="dayPick" value="${d}"></div><button data-act="dayNext" aria-label="Вперёд">›</button></div>
 <div class="card hero">${ring}<div class="side">${side}</div></div>
 ${hint?`<div class="note" style="margin-top:-10px">${esc(hint)}</div>`:''}${warn?`<div class="note" style="margin-top:-12px;color:var(--orange)">${esc(warn)}</div>`:''}
 ${budgetAlerts(ym)}

function goalLiabs(g){const all=liabilities();const ids=(g.debtIds||'').split(',').filter(Boolean);return ids.length?all.filter(x=>ids.includes(x.key)):all}
function goalProgress(g){
 if(g.type==='save'){const acc=g.linkedAccountId&&byId('accounts',g.linkedAccountId);const c=acc?Math.max(0,toBase(acc.currency||'',C().bal[acc.id])):num(g.current),t=num(g.target);return {cur:c,target:t,pct:t>0?Math.min(1,c/t):0}}
 const L=goalLiabs(g),rem=L.reduce((s,x)=>s+x.bal,0),t=Math.max(num(g.target),rem);return {cur:t-rem,target:t,rem,pct:t>0?Math.max(0,(t-rem)/t):1}}
function saveSim(c,target,m,rate,maxM){maxM=maxM||600;let b=c,i=0,hist=[b],intr=0;const r=rate/1200;
 while(i<maxM&&b<target){const x=b*r;intr+=x;b+=x+m;i++;hist.push(b);if(i>=maxM)break}
 return {months:i,hist,reached:b>=target,interest:intr}}
function requiredMonthly(c,target,rate,n){const r=rate/1200;if(c>=target)return 0;if(r===0)return (target-c)/n;const f=Math.pow(1+r,n);return Math.max(0,(target-c*f)*r/(f-1))}
function avgNet(){const t=pd(today());let tot=0,k=0;for(let i=1;i<=3;i++){const d=new Date(t.getFullYear(),t.getMonth()-i,1),a=ymd(d),b=ymd(new Date(d.getFullYear(),d.getMonth(),dim(d.getFullYear(),d.getMonth())));const tx=txOn(a,b);if(tx.length){tot+=sumT(tx,'income')-sumT(tx,'expense');k++}}return k?tot/k:null}
function catAvg(){const t=pd(today());const map={};let k=0;for(let i=1;i<=3;i++){const d=new Date(t.getFullYear(),t.getMonth()-i,1),a=ymd(d),b=ymd(new Date(d.getFullYear(),d.getMonth(),dim(d.getFullYear(),d.getMonth())));const tx=txOn(a,b);if(tx.length){k++;tx.forEach(x=>{if(x.type==='expense')map[x.category||'Прочее']=(map[x.category||'Прочее']||0)+num(x.amount)})}}
 if(!k){txOn(today().slice(0,8)+'01',today()).forEach(x=>{if(x.type==='expense')map[x.category||'Прочее']=(map[x.category||'Прочее']||0)+num(x.amount)});k=1}
 Object.keys(map).forEach(c=>map[c]/=k);return map}
function payoff(items,budget,strategy,wantRows){
 const L=items.map(x=>({key:x.key,name:x.name,bal:x.bal,apr:x.apr,min:x.min}));
 const sumMin=L.reduce((s,x)=>s+x.min,0),B=strategy==='minimum'?sumMin:Math.max(budget,sumMin),hist=[L.reduce((s,x)=>s+x.bal,0)],closed={},plan1={},rows=[];let m=0,interest=0;
 while(m<600&&L.some(x=>x.bal>0.005)){m++;
  const start=hist[hist.length-1];let im=0,paid=0;const per={};
  for(const x of L)if(x.bal>0){const i=x.bal*x.apr/1200;x.bal+=i;im+=i}
  interest+=im;let avail=strategy==='minimum'?0:B;
  const pay=(x,p)=>{x.bal-=p;paid+=p;per[x.key]=(per[x.key]||0)+p;if(m===1)plan1[x.key]=(plan1[x.key]||0)+p};
  for(const x of L)if(x.bal>0){const p=Math.min(x.min,x.bal);pay(x,p);if(strategy!=='minimum')avail-=p}
  if(strategy!=='minimum'){const ord=L.filter(x=>x.bal>0.005).sort(strategy==='avalanche'?(a,b)=>b.apr-a.apr||a.bal-b.bal:(a,b)=>a.bal-b.bal);
   for(const x of ord){if(avail<=0.005)break;const p=Math.min(avail,x.bal);pay(x,p);avail-=p}}
  for(const x of L)if(x.bal<=0.005){x.bal=0;if(closed[x.key]===undefined)closed[x.key]=m}
  const tot=L.reduce((s,x)=>s+x.bal,0);hist.push(tot);
  if(wantRows)rows.push({m,start,interest:im,paid,principal:paid-im,end:tot,per});
  if(tot>1e12)break}
 return {months:m,stuck:L.some(x=>x.bal>0.005),interest,hist,closed,plan1,budget:B,rows}}
function requiredBudget(items,n){const sumMin=items.reduce((s,x)=>s+x.min,0),tot=items.reduce((s,x)=>s+x.bal,0);let lo=sumMin,hi=tot*1.5+sumMin+1;
 if(!payoff(items,hi,'avalanche').stuck&&payoff(items,lo,'avalanche').months<=n&&!payoff(items,lo,'avalanche').stuck)return lo;
 for(let i=0;i<40;i++){const mid=(lo+hi)/2,r=payoff(items,mid,'avalanche');if(!r.stuck&&r.months<=n)hi=mid;else lo=mid}return Math.ceil(hi)}

function saveCtx(g){const p=goalProgress(g);const acc=g.linkedAccountId&&byId('accounts',g.linkedAccountId);

const rateRow=(p,v,cls)=>{const u=rateUnit(),shown=v?String(rateNum(num(v))):'';return `<div class="row ${cls||''}"><label style="min-width:0;margin-right:8px">Ставка, %</label><select id="${p}_rp" style="flex:none;width:auto;margin-right:8px;color:var(--blue);text-align:left;text-align-last:left"><option value="m" ${u==='m'?'selected':''}>в месяц</option><option value="y" ${u==='y'?'selected':''}>в год</option></select><input id="${p}_rate" inputmode="decimal" placeholder="0" value="${shown}" data-orig="${num(v)}" data-shown="${shown}" data-unit="${u}" style="flex:1;min-width:0"></div>`};
const wireRate=(el,p)=>{const s=$('#'+p+'_rp',el),i=$('#'+p+'_rate',el);let c=s.value;s.onchange=()=>{const v=num(i.value);if(v){const nv=s.value==='m'&&c==='y'?v/12:s.value==='y'&&c==='m'?v*12:v;i.value=String(Math.round(nv*100)/100)}c=s.value}};
const rateVal=(el,p)=>{const i=$('#'+p+'_rate',el),s=$('#'+p+'_rp',el);if(i.value===i.dataset.shown&&s.value===i.dataset.unit)return num(i.dataset.orig);const v=num(i.value);return s.value==='m'?Math.round(v*12*100)/100:v};
function accSheet(id){
 const ex=id?byId('accounts',id):null;

 const bal=ex?C().bal[id]:0;let color=a.color||'blue';

 const t0=today(),ms=t0.slice(0,8)+'01',spent=ex?txOn(ms,t0).filter(t=>t.type==='expense'&&t.accountId===id).reduce((s,t)=>s+num(t.amount),0):0;
 const body=`${ex?`<div class="grid2"><div class="tile"><div class="k">${isCr?'Долг':'Баланс'}</div><div class="v">${moneyC(isCr?Math.max(0,-bal):bal,a.currency)}</div></div><div class="tile"><div class="k">${isCr?'Доступно':'Расходы за месяц'}</div><div class="v">${moneyC(isCr?num(a.creditLimit)+bal:spent,a.currency)}</div></div></div>`:''}

  <div class="row" id="r_cur"><label>Валюта</label><select id="a_cur" ${ex?'disabled':''}>${opt('','Основная ('+cur()+')',a.currency||'')}${CCODES.map(c=>opt(c,c+' '+CSYM[c],a.currency||'')).join('')}</select></div>
  <div class="row" id="r_l4"><label>Последние 4 цифры</label><input id="a_l4" inputmode="numeric" maxlength="4" placeholder="1234" value="${esc(a.last4)}"></div>

  <div class="row cr"><label>Кредитный лимит</label><input id="a_lim" inputmode="decimal" placeholder="0" value="${a.creditLimit||''}"></div>
  ${rateRow('a',a.rate,'cr')}

  <div class="row cr"><label>День платежа (1–31)</label><input id="a_due" inputmode="numeric" placeholder="25" value="${a.dueDay||''}"></div></div>
 <div class="group"><div class="swatches" id="a_sw">${swatches(color)}</div></div>
 ${ex?`<div class="note" style="margin:-12px 16px 18px">Изменение баланса создаёт корректировку, она не попадает в доходы и расходы.</div>
 <div class="group-title">История операций</div><div class="group">${recent.length?recent.slice(0,15).map(t=>txRow(t)).join(''):'<div class="empty">Операций пока нет</div>'}</div>
 ${recent.length>15?`<button class="more" data-hist>Вся история (${recent.length})</button>`:''}
 ${isCr&&bal<-0.005?'<button class="btn" data-payc>Внести платёж по карте</button>':''}
 <div class="btnrow"><button class="btn gray" data-add>Добавить операцию</button></div><button class="btn red" data-del>Удалить счёт</button>`:''}`;
 sheet({title:ex?a.name||'Счёт':'Новый счёт',body,saveLabel:ex?'Сохранить':'Добавить',onMount:(el,close)=>{
  const q=s=>$(s,el);const upd=()=>{const k=q('#a_kind').value;$$('.cr',el).forEach(r=>r.hidden=k!=='credit');q('#r_l4').hidden=k==='cash';q('#r_cur').hidden=k==='credit';q('#l_bal').textContent=k==='credit'?'Использовано из лимита':k==='savings'?'Накоплено':'Текущий баланс'};

  q('#a_cc').oninput=e=>{color=e.target.value;$$('.sw',el).forEach(s=>s.classList.remove('on'));const cu=q('[data-cust]');cu.classList.add('on');cu.style.background=hexGrad(color)};

  const kind=q('#a_kind').value,v=num(q('#a_bal').value),want=kind==='credit'?-v:v;

  if(!ex)o.opening=want;

  render();toast('Сохранено')}});}

/* свайп влево на операции: появляется «Удалить» */
let sw=null,swOpen=null,swMoved=0,swLP=0;
const SWW=88;
function swClose(){if(swOpen){swOpen.style.transform='';swOpen=null}}
document.addEventListener('pointerdown',e=>{const r=e.target.closest('.row.swp');
 if(swOpen&&swOpen!==r&&!e.target.closest('.sdel'))swClose();
 if(!r||e.target.closest('.sdel')||(e.pointerType==='mouse'&&e.button!==0))return;
 swLP=0;sw={r,x:e.clientX,y:e.clientY,base:swOpen===r?-SWW:0,on:false,id:e.pointerId};
 sw.lp=setTimeout(()=>{if(!sw||sw.on||sw.r!==r)return;sw=null;swLP=1;swMoved=Date.now();try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}txMenu(r.dataset.id)},550)},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.row.swp'))e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;if(Math.abs(dx)>8||Math.abs(dy)>8)clearTimeout(sw.lp);
 if(!sw.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){sw=null;return}
  if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){sw.on=true;sw.r.classList.add('drag');try{sw.r.setPointerCapture(e.pointerId)}catch(x){}}else return}
 let v=sw.base+dx;if(v>0)v=0;if(v<-SWW)v=-SWW-Math.sqrt(-v-SWW)*3;
 sw.r.style.transform='translateX('+v+'px)'},true);
function swEnd(e){if(!sw||(e&&e.pointerId!==sw.id))return;clearTimeout(sw.lp);const {r,on,base,x}=sw;sw=null;if(!on)return;
 r.classList.remove('drag');swMoved=Date.now();
 const dx=(e?e.clientX:x)-x,v=base+dx;
 if(v<-SWW/2){if(swOpen&&swOpen!==r)swClose();r.style.transform='translateX(-'+SWW+'px)';swOpen=r}
 else{r.style.transform='';if(swOpen===r)swOpen=null}}
document.addEventListener('pointerup',swEnd,true);document.addEventListener('pointercancel',swEnd,true);
document.addEventListener('click',e=>{
 const sd=e.target.closest('.sdel');if(sd){e.stopPropagation();e.preventDefault();A.swDel(sd);return}
 if(swLP&&e.target.closest('.row.swp')){swLP=0;e.stopPropagation();e.preventDefault();return}
 if(Date.now()-swMoved<400&&e.target.closest('.row.swp')&&!e.target.closest('.sdel')){e.stopPropagation();e.preventDefault();return}
 if(swOpen&&!e.target.closest('.sdel')){e.stopPropagation();e.preventDefault();swClose()}},true);
function delTxUndo(id,row){const t=byId('transactions',id);if(!t)return;swOpen=null;del('transactions',id);if(row&&row.closest('.sheet'))row.remove();render();
 toastAct('Операция удалена','Отменить',()=>{const o=S.transactions.find(x=>x.id===id);if(o){o.deleted=0;o.updatedAt=Date.now();S.dirty['transactions:'+id]=1;CACHE=null;persist();scheduleSync();render()}})}
function txMenu(id){const t=byId('transactions',id);if(!t)return;swClose();const m=txMeta(t),el=document.createElement('div');el.className='overlay top';
 el.innerHTML=`<div class="action"><div class="box"><div class="msg">${esc(m.title)} · ${esc(m.amt)}</div><button class="abtn" data-v="edit" style="color:var(--blue)">Изменить</button><button class="abtn" data-v="del">Удалить</button></div><button class="abtn cancel">Отмена</button></div>`;
 document.body.appendChild(el);const done=()=>el.remove();
 $('[data-v="edit"]',el).onclick=()=>{done();A.editTx({dataset:{id}})};
 $('[data-v="del"]',el).onclick=()=>{done();delTxUndo(id)};
 $('.cancel',el).onclick=done;el.addEventListener('mousedown',e=>{if(e.target===el)done()})}
let qp=null;
function qcancel(){if(qp){clearTimeout(qp.t);qp.el.classList.remove('hold');qp=null}}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-q]');if(!el||(e.pointerType==='mouse'&&e.button!==0))return;qcancel();
 qp={id:el.dataset.q,x:e.clientX,y:e.clientY,fired:false,el};el.classList.add('hold');
 qp.t=setTimeout(()=>{if(!qp)return;qp.fired=true;qp.el.classList.remove('hold');try{navigator.vibrate&&navigator.vibrate(20)}catch(x){}quickPriceSheet(qp.id)},LONG_MS)});
document.addEventListener('pointermove',e=>{if(qp&&Math.hypot(e.clientX-qp.x,e.clientY-qp.y)>10)qcancel()});
document.addEventListener('pointerup',()=>{if(!qp)return;const q=qp;clearTimeout(q.t);q.el.classList.remove('hold');qp=null;if(!q.fired)quickAdd(q.id)});
document.addEventListener('pointercancel',qcancel);
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-q]'))e.preventDefault()});

 S.accounts.filter(a=>a.deleted&&num(a.updatedAt)>=lim).forEach(a=>items.push({k:'accounts',id:a.id,u:a.updatedAt,icon:'💳',title:a.name||'Счёт',sub:'счёт',amt:''}));

/* ================= PIN-КОД ================= */
const LOCK_MS=60000;
const pinData=()=>{try{return JSON.parse(localStorage.getItem('budget.pin'))}catch(e){return null}};
async function hashPin(pin,salt){const d=new TextEncoder().encode(salt+':'+pin);
 if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',d);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
 let h=5381;for(const b of d)h=((h<<5)+h+b)|0;return 'x'+(h>>>0).toString(16)}
function pinPad(o){return new Promise(res=>{
 const el=document.createElement('div');el.className='lock';
 el.innerHTML=`<div class="lk-in"><div class="lk-t">${esc(o.title)}</div><div class="lk-s" id="lkS">${esc(o.sub||'')}</div><div class="lk-d" id="lkD"><i></i><i></i><i></i><i></i></div><div class="lk-k">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('')}</div><div class="lk-b"><span>${o.cancel?'<button class="link" data-c>Отмена</button>':''}</span><span>${o.forgot?'<button class="link" data-f>Забыли PIN?</button>':''}</span></div></div>`;
 document.body.appendChild(el);document.body.classList.add('noscroll');
 let v='',busy=false;const dots=()=>$$('#lkD i',el).forEach((d,i)=>d.classList.toggle('on',i<v.length));
 const close=()=>{document.removeEventListener('keydown',kd);el.remove();if(!$('.overlay')&&!$('.lock'))document.body.classList.remove('noscroll')};
 const press=async x=>{if(busy)return;if(x==='⌫')v=v.slice(0,-1);else if(v.length<4)v+=x;dots();
  if(v.length===4){busy=true;const r=await o.check(v);busy=false;if(r===true){close();res(v)}else{const d=$('#lkD',el);d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');$('#lkS',el).textContent=r||'Неверный PIN';v='';dots()}}};
 const kd=e=>{if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫')};document.addEventListener('keydown',kd);
 el.onclick=e=>{const k=e.target.closest('[data-k]');if(k){press(k.dataset.k);return}
  if(e.target.closest('[data-c]')){close();res(null)}else if(e.target.closest('[data-f]'))o.forgot(close,res)}})}
let lockedNow=false;
async function lockApp(){if(!pinData()||lockedNow)return;lockedNow=true;let fails=0,until=0;
 await pinPad({title:'Seyfa',sub:'Введите PIN',
  forgot:async(close,res)=>{const txt=CFG.url?'Сбросить PIN? Данные в этом браузере будут стёрты и снова подтянутся из Google Таблицы.':'Сбросить PIN? Подключения к таблице нет, поэтому данные на этом устройстве будут потеряны.';
   if(await confirmSheet(txt,'Сбросить')){localStorage.removeItem('budget.pin');S={transactions:[],accounts:[],debts:[],goals:[],settings:{},dirty:{}};persist();close();res(true);render();if(CFG.url)doSync()}},
  check:async v=>{if(Date.now()<until)return 'Подождите '+Math.ceil((until-Date.now())/1000)+' с';const d=pinData();if(!d)return true;
   if((await hashPin(v,d.s))===d.h){fails=0;return true}fails++;if(fails>=5){until=Date.now()+30000;fails=0;return 'Слишком много попыток: подождите 30 с'}return 'Неверный PIN'}});
 lockedNow=false}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>LOCK_MS&&pinData())lockApp()});
async function pinSettings(){const d=pinData();
 if(!d){const a=await pinPad({title:'Новый PIN',sub:'Придумайте 4 цифры',cancel:true,check:async()=>true});if(!a)return;
  const b=await pinPad({title:'Повторите PIN',sub:'Ещё раз те же 4 цифры',cancel:true,check:async v=>v===a?true:'PIN не совпал'});if(!b)return;
  const salt=uid();localStorage.setItem('budget.pin',JSON.stringify({s:salt,h:await hashPin(a,salt)}));toast('PIN включён');return}
 const ok=await pinPad({title:'Текущий PIN',sub:'Подтвердите, что это вы',cancel:true,check:async v=>(await hashPin(v,d.s))===d.h?true:'Неверный PIN'});if(!ok)return;
 sheet({title:'PIN-код',noSave:true,body:'<button class="btn" data-ch>Сменить PIN</button><button class="btn red" data-off style="margin-top:12px">Выключить PIN</button><div class="note">PIN защищает приложение на этом устройстве. Он не хранится в таблице.</div>',onMount:(el,close)=>{
  $('[data-off]',el).onclick=()=>{localStorage.removeItem('budget.pin');close();toast('PIN выключен')};
  $('[data-ch]',el).onclick=async()=>{close();localStorage.removeItem('budget.pin');const a=await pinPad({title:'Новый PIN',sub:'Придумайте 4 цифры',cancel:true,check:async()=>true});
   if(!a){localStorage.setItem('budget.pin',JSON.stringify(d));return}
   const b=await pinPad({title:'Повторите PIN',cancel:true,check:async v=>v===a?true:'PIN не совпал'});
   if(!b){localStorage.setItem('budget.pin',JSON.stringify(d));return}
   const salt=uid();localStorage.setItem('budget.pin',JSON.stringify({s:salt,h:await hashPin(a,salt)}));toast('PIN изменён')}}})}

let syncState=CFG.url?'idle':'off',lastErr='',lastSync=0,syncing=false,syncAgain=false,syncTimer;
async function api(action,payload){
 if(!CFG.url)throw new Error('Не указан URL скрипта');
 const res=await fetch(CFG.url,{method:'POST',redirect:'follow',body:JSON.stringify(Object.assign({token:CFG.token,action},payload||{}))});
 if(!res.ok)throw new Error('HTTP '+res.status);const txt=await res.text();let j;try{j=JSON.parse(txt)}catch(e){throw new Error('Скрипт вернул не JSON — проверьте доступ «Все» и URL')}
 if(j.error)throw new Error(j.error);return j}
function normRow(t,r){const o={};SCHEMA[t].forEach(c=>{let v=r[c];if(NUMF.has(c))v=num(v);else v=v==null?'':String(v);o[c]=v});return o}
function scheduleSync(){if(!CFG.url)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>doSync(),900)}
async function doSync(manual){
 if(!CFG.url){syncState='off';$('#syncBtn').innerHTML=syncIcon();return}
 if(syncing){syncAgain=true;return}syncing=true;syncState='busy';$('#syncBtn').innerHTML=syncIcon();
 try{
  const keys=Object.keys(S.dirty).filter(k=>!k.split(':')[1].startsWith('demo_')),changes={},snap={};
  keys.forEach(k=>{const [t,id]=[k.slice(0,k.indexOf(':')),k.slice(k.indexOf(':')+1)];let row;
   if(t==='settings'){const s=S.settings[id];if(!s)return;row={key:id,value:JSON.stringify(s.value),updatedAt:s.updatedAt};snap[k]=s.updatedAt}
   else{const o=S[t].find(x=>x.id===id);if(!o)return;row={};SCHEMA[t].forEach(c=>row[c]=o[c]);snap[k]=o.updatedAt}
   (changes[t]=changes[t]||[]).push(row)});
  if(Object.keys(changes).length)await api('push',{changes});
  keys.forEach(k=>{const [t,id]=[k.slice(0,k.indexOf(':')),k.slice(k.indexOf(':')+1)];const cur_=t==='settings'?(S.settings[id]||{}).updatedAt:(S[t].find(x=>x.id===id)||{}).updatedAt;if(cur_===snap[k])delete S.dirty[k]});
  const {data,version,rates,bot}=await api('pull');if(bot&&typeof bot==='object'){try{localStorage.setItem('budget.bot',JSON.stringify(bot))}catch(e){}}if(rates&&typeof rates==='object'){const r=ratesStore();r.auto={};CCODES.forEach(c=>{if(num(rates[c])>0)r.auto[c]=num(rates[c])});r.date=rates.date||'';try{localStorage.setItem('budget.rates',JSON.stringify(r))}catch(e){}CACHE=null}if(!(version>=NEED_V)&&!window.__oldV){window.__oldV=1;setTimeout(()=>toast('Скрипт таблицы устарел — обновите Code.gs'),300)}
  TABLES.forEach(t=>(data[t]||[]).forEach(r=>{const o=normRow(t,r);if(!o.id)return;const i=S[t].findIndex(x=>x.id===o.id);
   if(i<0)S[t].push(o);else if(o.updatedAt>S[t][i].updatedAt&&!S.dirty[t+':'+o.id])S[t][i]=o}));
  (data.settings||[]).forEach(r=>{const k=String(r.key);if(!k)return;const ua=num(r.updatedAt),loc=S.settings[k];if((!loc||ua>loc.updatedAt)&&!S.dirty['settings:'+k]){try{S.settings[k]={value:JSON.parse(r.value),updatedAt:ua}}catch(e){}}});
  persist();syncState='ok';lastErr='';lastSync=Date.now();
 }catch(e){syncState='err';lastErr=e.message;if(manual)toast('Синхронизация: '+e.message)}
 syncing=false;CACHE=null;if(!$('.sheet'))render();else $('#syncBtn').innerHTML=syncIcon();
 if(syncAgain){syncAgain=false;scheduleSync()}}

  const sideB=below>=ch||(above<ch&&below>=above),space=sideB?below:above;let top;
  if(ch<=space)top=sideB?r.bottom+pd+12:r.top-pd-12-ch;
  else{/* высокая цель: карточка у края экрана, подсветка обрезается по её границе */const hh=Math.min(ch,H-24);if(hh<ch)card.style.maxHeight=hh+'px';
   if(sideB){top=H-hh-12;const lim=top-10;if(r.top-pd+r.height+pd*2>lim)hl.style.height=Math.max(40,lim-(r.top-pd))+'px'}else{top=12;const lim=top+hh+10;if(r.top-pd<lim){hl.style.top=lim+'px';hl.style.height=Math.max(40,r.bottom+pd-lim)+'px'}}}
  card.style.top=Math.max(8,top)+'px';card.style.left=Math.min(Math.max(12,r.left+r.width/2-cw/2),W-cw-12)+'px'}
 else{ov.classList.add('dim');hl.style.display='none';if(ch>H-24){card.classList.add('compact');ch=card.offsetHeight}card.style.top=Math.max(12,(H-ch)/2)+'px';card.style.left=(W-cw)/2+'px'}}
