<style>

}}
:root[data-theme=dark]{

  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;--teal:#40c8e0;--pink:#ff375f;

}
:root{color-scheme:light dark}:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.catsearch{padding-bottom:0;min-height:40px}.catsearch input{text-align:left;text-align-last:left}
.chip.new{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.chip{border:0;background:var(--fill);border-radius:16px;padding:7px 12px;font-size:15px;cursor:pointer;white-space:nowrap}

.grid-cards{display:grid;grid-template-columns:1fr;gap:14px;margin:0 0 22px}

  <div id="navL" style="min-width:90px"></div>

function moneyC(n,code,sign){if(!code)return money(n,sign);n=num(n);const a=Math.abs(n),s=(a>=100?nf0:nf).format(a);return (n<0?'−':sign&&n>0?'+':'')+s+' '+(CSYM[code]||code)}
function compute(){
 const bal={},rem={},dir={};
 live('accounts').forEach(a=>bal[a.id]=num(a.opening));

let chartSeq=0;
function barChart(o){
 const W=640,H=o.h||190,L=40,R=6,T=10,B=22,n=o.labels.length,iw=W-L-R,ih=H-T-B,id='tip'+(++chartSeq);

 let mx=Math.max(0,...all),mn=Math.min(0,...all);mx=niceMax(mx||1);mn=mn<0?-niceMax(-mn):0;const rg=mx-mn||1;
 const X=i=>L+iw*i/(n-1),Y=v=>T+ih*(1-(v-mn)/rg);

 const legend=o.series.length>1?`<div class="legend">${o.series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${zero}${tg}${paths}${xl}${hits}</svg><div class="tip" id="${id}">${esc(o.tip0||'Нажмите на график, чтобы увидеть значение')}</div>${legend}`}

  for(const x of L)if(x.bal>0){const i=x.bal*x.apr/1200;x.bal+=i;im+=i}
  interest+=im;let avail=strategy==='minimum'?0:B;
  const pay=(x,p)=>{x.bal-=p;paid+=p;per[x.key]=(per[x.key]||0)+p;if(m===1)plan1[x.key]=(plan1[x.key]||0)+p};
  for(const x of L)if(x.bal>0){const p=Math.min(x.min,x.bal);pay(x,p);if(strategy!=='minimum')avail-=p}
  if(strategy!=='minimum'){const ord=L.filter(x=>x.bal>0.005).sort(strategy==='avalanche'?(a,b)=>b.apr-a.apr||a.bal-b.bal:(a,b)=>a.bal-b.bal);
   for(const x of ord){if(avail<=0.005)break;const p=Math.min(avail,x.bal);pay(x,p);avail-=p}}
  for(const x of L)if(x.bal<=0.005){x.bal=0;if(closed[x.key]===undefined)closed[x.key]=m}
  const tot=L.reduce((s,x)=>s+x.bal,0);hist.push(tot);

function requiredBudget(items,n){const sumMin=items.reduce((s,x)=>s+x.min,0),tot=items.reduce((s,x)=>s+x.bal,0);let lo=sumMin,hi=tot*1.5+sumMin+1;

 for(let i=0;i<40;i++){const mid=(lo+hi)/2,r=payoff(items,mid,'avalanche');if(!r.stuck&&r.months<=n)hi=mid;else lo=mid}return Math.ceil(hi)}

 if(mode==='day'){const labels=[],full=[],vals=[];for(let i=6;i>=0;i--){const s=addDays(ref,-i);labels.push(wd.format(pd(s))+' '+pd(s).getDate());full.push(dtf.format(pd(s)));vals.push(sumC(txOn(s,s)))}

 else if(mode==='month'){const dm=dim(d.getFullYear(),d.getMonth()),labels=[],full=[],vals=[],cum=[],plan=[];let c=0;const endD=today()<b?(today()<a?-1:pd(today()).getDate()):dm;
  for(let i=1;i<=dm;i++){const s=a.slice(0,8)+pad(i);const v=sumC(txOn(s,s));labels.push(String(i));full.push(dtf.format(pd(s)));vals.push(v);c+=v;if(i<=endD)cum.push(c);plan.push(limit*i)}

  if(cum.length>1)charts+=`<div class="group-title">Нарастающий итог${limit?' и план по лимиту':''}</div><div class="card">${lineChart({series:[{name:'Факт',color:'var(--blue)',values:cum}].concat(limit?[{name:'План (лимит × дни)',color:'var(--orange)',dash:true,values:plan}]:[]),xlabel:i=>(i+1)+'-е',area:true,h:190})}</div>`}
 else{const labels=[],i_=[],e_=[],cum=[];let c=0;const now=new Date(),cm=d.getFullYear()===now.getFullYear()?now.getMonth():d.getFullYear()<now.getFullYear()?11:-1;
  for(let m=0;m<12;m++){const s=d.getFullYear()+'-'+pad(m+1)+'-01',e=d.getFullYear()+'-'+pad(m+1)+'-31',tx=txOn(s,e),ii=sumT(tx,'income'),ee=sumT(tx,'expense');labels.push(mshort.format(new Date(2000,m,1)));i_.push(ii);e_.push(ee);if(m<=cm){c+=ii-ee;cum.push(c)}}
  charts=`<div class="group-title">Доходы и расходы по месяцам</div><div class="card">${barChart({labels,series:[{name:'Доходы',color:'var(--green)',values:i_},{name:'Расходы',color:'var(--blue)',values:e_}],h:200})}</div>`;
  if(cum.length>1)charts+=`<div class="group-title">Накопленный результат за год</div><div class="card">${lineChart({series:[{name:'Доходы − расходы',color:'var(--green)',values:cum}],xlabel:i=>mshort.format(new Date(2000,i,1)),area:true,h:180})}</div>`}
 const top=txs.filter(t=>t.type==='expense').sort((x,y)=>num(y.amount)-num(x.amount)).slice(0,5);
 const accTotal=Object.values(accE).reduce((s,v)=>s+v,0);
 return `<h1 class="large">Статистика</h1>
 <div class="seg">${[['day','День'],['month','Месяц'],['year','Год']].map(([k,v])=>`<button data-act="statMode" data-v="${k}" class="${mode===k?'on':''}">${v}</button>`).join('')}</div>
 <div class="daynav"><button data-act="statPrev" aria-label="Назад">‹</button><div class="daylabel" style="text-transform:capitalize">${esc(label)}</div><button data-act="statNext" aria-label="Вперёд">›</button></div>

 <div class="tile"><div class="k">Остаток на начало</div><div class="v sm">${money(tStart)}</div><div class="sub">все счета, за вычетом долга по картам</div></div><div class="tile"><div class="k">Остаток на конец</div><div class="v sm">${money(tEnd)}</div></div></div>
 ${charts}
 ${exp>0?`<div class="group-title">Расходы по категориям</div><div class="card" style="padding-bottom:6px">${donutOf(catE,'expense','расходы')}</div><div class="group">${catRows(catE,'expense',exp)}</div>`:`<div class="group"><div class="empty">Нет расходов за период</div></div>`}
 ${inc>0?`<div class="group-title">Доходы по источникам</div><div class="group">${catRows(catI,'income',inc)}</div>`:''}

 ${top.length?`<div class="group-title">Самые крупные траты</div><div class="group">${top.map(t=>txRow(t,true)).join('')}</div>`:''}
 ${mode==='day'&&txs.length?`<div class="group-title">Операции дня</div><div class="group">${txs.sort(cmpTx).map(t=>txRow(t)).join('')}</div>`:''}`}

function sheet(o){
 const el=document.createElement('div');el.className='overlay';
 el.innerHTML=`<div class="sheet" role="dialog"><div class="sheet-h"><button class="link" data-x>${o.noSave?'':'Отмена'}</button><div class="sheet-t">${esc(o.title)}</div>${o.noSave?'<button class="link b" data-x>Готово</button>':`<button class="link b" data-ok>${o.saveLabel||'Готово'}</button>`}</div><div class="sheet-b">${o.body}</div></div>`;
 document.body.appendChild(el);document.body.classList.add('noscroll');
 const close=()=>{el.remove();if(!$('.overlay'))document.body.classList.remove('noscroll')};
 el.addEventListener('mousedown',e=>{if(e.target===el)close()});
 $$('[data-x]',el).forEach(b=>b.onclick=close);
 const ok=$('[data-ok]',el);if(ok)ok.onclick=()=>{if(o.save(el)!==false)close()};
 if(o.onMount)o.onMount(el,close);return {el,close}}
function confirmSheet(text,okLabel){return new Promise(res=>{const el=document.createElement('div');el.className='overlay top';
 el.innerHTML=`<div class="action"><div class="box"><div class="msg">${esc(text)}</div><button class="abtn" data-v="1">${okLabel||'Удалить'}</button></div><button class="abtn cancel">Отмена</button></div>`;
 document.body.appendChild(el);const done=v=>{el.remove();res(v)};
 $('[data-v]',el).onclick=()=>done(true);$('.cancel',el).onclick=()=>done(false);el.addEventListener('mousedown',e=>{if(e.target===el)done(false)})})}
const opt=(v,t,sel)=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(t)}</option>`;
const lastAcc=()=>{const id=localStorage.getItem('budget.lastAcc');return byId('accounts',id)?id:(live('accounts')[0]||{}).id||''};
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}

function txSheet(id,preset){
 preset=preset||{};const ex=id?byId('transactions',id):null;
 const t=ex?Object.assign({},ex):{id:uid(),date:preset.date||(tab==='today'?TD.date:today()),type:preset.type||'expense',amount:preset.amount||'',category:'',accountId:preset.accountId!==undefined?preset.accountId:lastAcc(),toAccountId:preset.toAccountId||'',debtId:preset.debtId||'',note:''};
 let type=t.type,cat=t.category;const accs=live('accounts'),debts=live('debts');
 const body=`<div class="seg" id="tx_type">${[['expense','Расход'],['income','Доход'],['transfer','Перевод'],['debtpay','Долг']].map(([k,n])=>`<button data-v="${k}">${n}</button>`).join('')}</div>
 <div class="amtbox"><input id="tx_amt" inputmode="decimal" placeholder="0" value="${t.amount?esc(t.amount):''}" autocomplete="off"><span id="tx_cur">${esc(cur())}</span></div>
 <div class="group" id="tx_cg"><div class="row catsearch"><input id="tx_cs" placeholder="Поиск или своя категория" autocomplete="off" autocapitalize="sentences" enterkeyhint="done"></div><div class="chips two" id="tx_cats"></div></div>
 <div class="group">
  <div class="row" id="r_acc"><label id="l_acc">Счёт</label><select id="tx_acc"></select></div>
  <div class="row" id="r_to"><label>На счёт</label><select id="tx_to"></select></div>
  <div class="row" id="r_toamt"><label id="l_toamt">Получено</label><input id="tx_toamt" inputmode="decimal" placeholder="по курсу" value="${num(t.toAmount)>0?esc(t.toAmount):''}"></div>
  <div class="row" id="r_debt"><label>Долг</label><select id="tx_debt"></select></div>
  <div class="row"><label>Дата</label><input type="date" id="tx_date" value="${t.date}"></div>
  <div class="row"><label>Заметка</label><input id="tx_note" placeholder="Необязательно" value="${esc(t.note)}"></div></div>
 ${ex?'<button class="btn red" data-del>Удалить операцию</button>':''}`;
 sheet({title:ex?'Операция':'Новая операция',body,saveLabel:ex?'Сохранить':'Добавить',onMount:(el,close)=>{
  const q=s=>$(s,el);
  const an=a=>a.name+(a.currency?' · '+a.currency:'');
  q('#tx_acc').innerHTML=opt('','— без счёта —',t.accountId)+accs.map(a=>opt(a.id,an(a),t.accountId)).join('');
  q('#tx_to').innerHTML=accs.map(a=>opt(a.id,an(a),t.toAccountId||(accs.find(x=>x.id!==t.accountId)||{}).id)).join('');
  q('#tx_debt').innerHTML=debts.map(d=>{const r=C().rem[d.id];return opt(d.id,d.name+' · '+money(r),t.debtId)}).join('')||'<option value="">нет долгов</option>';
  const catQ=()=>q('#tx_cs').value.trim();
  const renderCats=()=>{const base=(type==='income'?INC:EXP).map(c=>c[0]),all=base.concat(customCats(type)),k=catQ().toLowerCase();
   let list=k?all.filter(n=>n.toLowerCase().includes(k)):all.slice();
   if(cat&&!k){const i=list.indexOf(cat);if(i>0){list.splice(i,1);list.unshift(cat)}}
   const exact=all.some(n=>n.toLowerCase()===k);
   q('#tx_cats').innerHTML=list.map(n=>`<button class="chip ${n===cat?'on':''}" data-c="${esc(n)}">${catInfo(n,type).icon} ${esc(n)}</button>`).join('')+(k&&!exact?`<button class="chip new" data-new="${esc(catQ())}">＋ Создать «${esc(catQ())}»</button>`:'');q('#tx_cats').scrollLeft=0};
  const addCat=n=>{n=n.trim().slice(0,24);if(!n)return;const l=setting('customCats',[]);if(!l.some(c=>c.n===n&&c.t===type))l.push({n,t:type});setSetting('customCats',l);cat=n;q('#tx_cs').value='';renderCats()};
  const curUi=()=>{const sc=accCur(q('#tx_acc').value),dc=accCur(q('#tx_to').value);q('#tx_cur').textContent=CSYM[sc]||cur();
   const x=type==='transfer'&&q('#tx_acc').value&&q('#tx_to').value&&sc!==dc;q('#r_toamt').hidden=!x;
   if(x){const r=rateOf(sc)&&rateOf(dc)?rateOf(sc)/rateOf(dc):0,a=num(q('#tx_amt').value);q('#l_toamt').textContent='Получено, '+(CSYM[dc]||cur());q('#tx_toamt').placeholder=r&&a>0?String(Math.round(a*r*100)/100):'по курсу'}};
  const upd=()=>{$$('#tx_type button',el).forEach(b=>b.classList.toggle('on',b.dataset.v===type));
   q('#tx_cg').hidden=!(type==='expense'||type==='income');q('#r_to').hidden=type!=='transfer';q('#r_debt').hidden=type!=='debtpay';
   const dl=byId('debts',q('#tx_debt').value);
   q('#l_acc').textContent=type==='income'?'На счёт':type==='transfer'?'Со счёта':type==='debtpay'?(dl&&dl.direction==='lent'?'На счёт':'Со счёта'):'Счёт';
   q('#tx_acc').firstChild.textContent=type==='transfer'||type==='debtpay'?'— выберите —':'— без счёта —';renderCats();curUi()};
  $$('#tx_type button',el).forEach(b=>b.onclick=()=>{type=b.dataset.v;cat='';q('#tx_cs').value='';upd()});
  q('#tx_debt').onchange=upd;q('#tx_acc').onchange=curUi;q('#tx_to').onchange=curUi;q('#tx_amt').addEventListener('input',curUi);
  q('#tx_cats').onclick=e=>{const c=e.target.closest('[data-c]'),nw=e.target.closest('[data-new]');
   if(c){cat=c.dataset.c;q('#tx_cs').value='';renderCats()}else if(nw)addCat(nw.dataset.new)};
  q('#tx_cs').oninput=renderCats;
  q('#tx_cs').onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();const k=catQ().toLowerCase();if(!k)return;
   const all=(type==='income'?INC:EXP).map(c=>c[0]).concat(customCats(type)),ex1=all.find(n=>n.toLowerCase()===k),m=all.filter(n=>n.toLowerCase().includes(k));
   if(ex1){cat=ex1;q('#tx_cs').value='';renderCats()}else if(m.length===1){cat=m[0];q('#tx_cs').value='';renderCats()}else addCat(catQ());q('#tx_cs').blur()};
  upd();if(!ex)setTimeout(()=>q('#tx_amt').focus(),150);

  save('transactions',o);if(acc)localStorage.setItem('budget.lastAcc',acc);render();const bm=ex?'':budgetMsg(o);toast(ex?'Сохранено':bm?'Добавлено · '+bm:'Добавлено')}});}

function planSheet(ym){
 const [yy,mm]=ym.split('-').map(Number),days=dim(yy,mm-1),ex=getPlan(ym);
 const P=ex?JSON.parse(JSON.stringify(ex)):{inc:[{n:'Основной доход',a:''}],exp:[],debt:[],sav:[]};
 ['inc','exp','debt','sav'].forEach(k=>P[k]=P[k]||[]);
 const SEC=[['inc','Доходы','Источник дохода'],['exp','Запланированные расходы','Категория'],['debt','Платежи по долгам и кредитам','Долг или карта'],['sav','Накопления','Цель или счёт']];
 const cats=EXP.map(c=>c[0]).concat(customCats('expense'));
 const secHtml=()=>SEC.map(([k,t,ph])=>`<div class="group-title">${t}</div><div class="group">${P[k].map((r,i)=>`<div class="row"><input class="pn" data-k="${k}" data-i="${i}" placeholder="${ph}" value="${esc(r.n)}" ${k==='exp'?'list="pl_cats"':''} style="text-align:left;text-align-last:left"><input class="pa" data-k="${k}" data-i="${i}" inputmode="decimal" placeholder="0" value="${esc(r.a)}" style="max-width:110px"><button class="link" data-rm="${k}:${i}" style="color:var(--red);padding:4px 0 4px 8px" aria-label="Удалить">✕</button></div>`).join('')}<div class="row tap" data-add="${k}"><div class="grow" style="color:var(--blue)">＋ Добавить строку</div></div></div>`).join('');
 const sumHtml=()=>{const c=planCalc(P),daily=c.free/days,share=c.inc>0?c.free/c.inc:0,debts=liabilities().reduce((s,x)=>s+x.bal,0);
  return `<div style="display:flex;justify-content:space-between"><span class="sub">Свободные средства</span><b style="color:${c.free<0?'var(--red)':'var(--green)'}">${money(c.free)}</b></div><div class="big-out" style="margin:6px 0">Бюджет на день: ${money(Math.max(0,daily))}</div><div class="sub">${days} дн. · свободно ${(share*100).toFixed(0)}% дохода · доходы ${money(c.inc)} − план ${money(c.exp+c.debt+c.sav)}</div><div class="sub" style="margin-top:4px">Долги: сейчас ${money(debts)} → после плановых платежей ${money(Math.max(0,debts-c.debt))}</div>${c.free<0?`<div style="margin-top:6px"><span class="badge bad">План превышает доходы на ${money(-c.free)}</span></div>`:c.inc>0&&share<.2?`<div style="margin-top:6px"><span class="badge warn">Свободно меньше 20% дохода</span></div>`:''}`};
 sheet({title:'План · '+monthName(new Date(yy,mm-1,1)),saveLabel:'Сохранить',body:`<datalist id="pl_cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><div class="card" id="pl_sum"></div><div id="pl_secs"></div>
  <div class="note" style="margin-top:-8px">Траты из запланированных категорий учитываются по плану и не уменьшают дневной лимит. Все остальные траты расходуют дневной бюджет.</div>
  <div class="btnrow"><button class="btn gray" data-prev>Из прошлого месяца</button><button class="btn gray" data-debts>Платежи из «Долгов»</button></div>${ex?'<button class="btn red" data-clr>Удалить план</button>':''}`,
  onMount:(el,close)=>{const upd=()=>{$('#pl_sum',el).innerHTML=sumHtml()},rr=()=>{$('#pl_secs',el).innerHTML=secHtml();upd()};rr();
   el.addEventListener('input',e=>{const t=e.target;if(t.classList.contains('pn'))P[t.dataset.k][+t.dataset.i].n=t.value;else if(t.classList.contains('pa')){P[t.dataset.k][+t.dataset.i].a=t.value;upd()}});
   el.addEventListener('click',e=>{const a=e.target.closest('[data-add]'),r=e.target.closest('[data-rm]');
    if(a){P[a.dataset.add].push({n:'',a:''});rr();const ins=$$('.pn[data-k="'+a.dataset.add+'"]',el);ins[ins.length-1].focus()}
    else if(r){const [k,i]=r.dataset.rm.split(':');P[k].splice(+i,1);rr()}});
   $('[data-prev]',el).onclick=()=>{const pp=getPlan(shiftMonth(ym+'-01',-1).slice(0,7));if(!pp){toast('За прошлый месяц плана нет');return}const c=JSON.parse(JSON.stringify(pp));['inc','exp','debt','sav'].forEach(k=>P[k]=c[k]||[]);rr()};

/* свайп влево на операции: появляется «Удалить» */
let sw=null,swOpen=null,swMoved=0;
const SWW=88;
function swClose(){if(swOpen){swOpen.style.transform='';swOpen=null}}
document.addEventListener('pointerdown',e=>{const r=e.target.closest('.row.swp');
 if(swOpen&&swOpen!==r&&!e.target.closest('.sdel'))swClose();
 if(!r||e.target.closest('.sdel')||(e.pointerType==='mouse'&&e.button!==0))return;
 sw={r,x:e.clientX,y:e.clientY,base:swOpen===r?-SWW:0,on:false,id:e.pointerId}},true);
document.addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
 if(!sw.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){sw=null;return}
  if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){sw.on=true;sw.r.classList.add('drag');try{sw.r.setPointerCapture(e.pointerId)}catch(x){}}else return}
 let v=sw.base+dx;if(v>0)v=0;if(v<-SWW)v=-SWW-Math.sqrt(-v-SWW)*3;
 sw.r.style.transform='translateX('+v+'px)'},true);
function swEnd(e){if(!sw||(e&&e.pointerId!==sw.id))return;const {r,on,base,x}=sw;sw=null;if(!on)return;
 r.classList.remove('drag');swMoved=Date.now();
 const dx=(e?e.clientX:x)-x,v=base+dx;
 if(v<-SWW/2){if(swOpen&&swOpen!==r)swClose();r.style.transform='translateX(-'+SWW+'px)';swOpen=r}
 else{r.style.transform='';if(swOpen===r)swOpen=null}}
document.addEventListener('pointerup',swEnd,true);document.addEventListener('pointercancel',swEnd,true);
document.addEventListener('click',e=>{
 const sd=e.target.closest('.sdel');if(sd){e.stopPropagation();e.preventDefault();A.swDel(sd);return}
 if(Date.now()-swMoved<400&&e.target.closest('.row.swp')&&!e.target.closest('.sdel')){e.stopPropagation();e.preventDefault();return}
 if(swOpen&&!e.target.closest('.sdel')){e.stopPropagation();e.preventDefault();swClose()}},true);
let qp=null;
function qcancel(){if(qp){clearTimeout(qp.t);qp.el.classList.remove('hold');qp=null}}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-q]');if(!el||(e.pointerType==='mouse'&&e.button!==0))return;qcancel();
 qp={id:el.dataset.q,x:e.clientX,y:e.clientY,fired:false,el};el.classList.add('hold');
 qp.t=setTimeout(()=>{if(!qp)return;qp.fired=true;qp.el.classList.remove('hold');try{navigator.vibrate&&navigator.vibrate(20)}catch(x){}quickPriceSheet(qp.id)},LONG_MS)});
document.addEventListener('pointermove',e=>{if(qp&&Math.hypot(e.clientX-qp.x,e.clientY-qp.y)>10)qcancel()});
document.addEventListener('pointerup',()=>{if(!qp)return;const q=qp;clearTimeout(q.t);q.el.classList.remove('hold');qp=null;if(!q.fired)quickAdd(q.id)});

async function hashPin(pin,salt){const d=new TextEncoder().encode(salt+':'+pin);
 if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',d);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
 let h=5381;for(const b of d)h=((h<<5)+h+b)|0;return 'x'+(h>>>0).toString(16)}
function pinPad(o){return new Promise(res=>{
 const el=document.createElement('div');el.className='lock';
 el.innerHTML=`<div class="lk-in"><div class="lk-t">${esc(o.title)}</div><div class="lk-s" id="lkS">${esc(o.sub||'')}</div><div class="lk-d" id="lkD"><i></i><i></i><i></i><i></i></div><div class="lk-k">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('')}</div><div class="lk-b"><span>${o.cancel?'<button class="link" data-c>Отмена</button>':''}</span><span>${o.forgot?'<button class="link" data-f>Забыли PIN?</button>':''}</span></div></div>`;
 document.body.appendChild(el);document.body.classList.add('noscroll');
 let v='',busy=false;const dots=()=>$$('#lkD i',el).forEach((d,i)=>d.classList.toggle('on',i<v.length));
 const close=()=>{document.removeEventListener('keydown',kd);el.remove();if(!$('.overlay')&&!$('.lock'))document.body.classList.remove('noscroll')};
 const press=async x=>{if(busy)return;if(x==='⌫')v=v.slice(0,-1);else if(v.length<4)v+=x;dots();
  if(v.length===4){busy=true;const r=await o.check(v);busy=false;if(r===true){close();res(v)}else{const d=$('#lkD',el);d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');$('#lkS',el).textContent=r||'Неверный PIN';v='';dots()}}};
 const kd=e=>{if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫')};document.addEventListener('keydown',kd);
 el.onclick=e=>{const k=e.target.closest('[data-k]');if(k){press(k.dataset.k);return}
  if(e.target.closest('[data-c]')){close();res(null)}else if(e.target.closest('[data-f]'))o.forgot(close,res)}})}

  check:async v=>{if(Date.now()<until)return 'Подождите '+Math.ceil((until-Date.now())/1000)+' с';const d=pinData();if(!d)return true;
   if((await hashPin(v,d.s))===d.h){fails=0;return true}fails++;if(fails>=5){until=Date.now()+30000;fails=0;return 'Слишком много попыток: подождите 30 с'}return 'Неверный PIN'}});
 lockedNow=false}

 if(!CFG.url)throw new Error('Не указан URL скрипта');
 const res=await fetch(CFG.url,{method:'POST',redirect:'follow',body:JSON.stringify(Object.assign({token:CFG.token,action},payload||{}))});

async function doSync(manual){
 if(!CFG.url){syncState='off';$('#syncBtn').innerHTML=syncIcon();return}
 if(syncing){syncAgain=true;return}syncing=true;syncState='busy';$('#syncBtn').innerHTML=syncIcon();
 try{
  const keys=Object.keys(S.dirty).filter(k=>!k.split(':')[1].startsWith('demo_')),changes={},snap={};
  keys.forEach(k=>{const [t,id]=[k.slice(0,k.indexOf(':')),k.slice(k.indexOf(':')+1)];let row;
   if(t==='settings'){const s=S.settings[id];if(!s)return;row={key:id,value:JSON.stringify(s.value),updatedAt:s.updatedAt};snap[k]=s.updatedAt}
   else{const o=S[t].find(x=>x.id===id);if(!o)return;row={};SCHEMA[t].forEach(c=>row[c]=o[c]);snap[k]=o.updatedAt}
   (changes[t]=changes[t]||[]).push(row)});
  if(Object.keys(changes).length)await api('push',{changes});
  keys.forEach(k=>{const [t,id]=[k.slice(0,k.indexOf(':')),k.slice(k.indexOf(':')+1)];const cur_=t==='settings'?(S.settings[id]||{}).updatedAt:(S[t].find(x=>x.id===id)||{}).updatedAt;if(cur_===snap[k])delete S.dirty[k]});
  const {data,version,rates,bot}=await api('pull');if(bot&&typeof bot==='object'){try{localStorage.setItem('budget.bot',JSON.stringify(bot))}catch(e){}}if(rates&&typeof rates==='object'){const r=ratesStore();r.auto={};CCODES.forEach(c=>{if(num(rates[c])>0)r.auto[c]=num(rates[c])});r.date=rates.date||'';try{localStorage.setItem('budget.rates',JSON.stringify(r))}catch(e){}CACHE=null}if(!(version>=NEED_V)&&!window.__oldV){window.__oldV=1;setTimeout(()=>toast('Скрипт таблицы устарел — обновите Code.gs'),300)}
  TABLES.forEach(t=>(data[t]||[]).forEach(r=>{const o=normRow(t,r);if(!o.id)return;const i=S[t].findIndex(x=>x.id===o.id);
   if(i<0)S[t].push(o);else if(o.updatedAt>S[t][i].updatedAt&&!S.dirty[t+':'+o.id])S[t][i]=o}));
  (data.settings||[]).forEach(r=>{const k=String(r.key);if(!k)return;const ua=num(r.updatedAt),loc=S.settings[k];if((!loc||ua>loc.updatedAt)&&!S.dirty['settings:'+k]){try{S.settings[k]={value:JSON.parse(r.value),updatedAt:ua}}catch(e){}}});
  persist();syncState='ok';lastErr='';lastSync=Date.now();
 }catch(e){syncState='err';lastErr=e.message;if(manual)toast('Синхронизация: '+e.message)}
 syncing=false;CACHE=null;if(!$('.sheet'))render();else $('#syncBtn').innerHTML=syncIcon();
